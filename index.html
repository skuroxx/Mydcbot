<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMEDEX — Card Realm</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon: #6B0F1A;
    --maroon-deep: #3D0509;
    --maroon-light: #8B1A2A;
    --maroon-glow: #B22234;
    --black: #0A0A0A;
    --black-card: #111115;
    --black-panel: #1A1A1F;
    --black-border: #2A2A30;
    --gold: #FFD700;
    --gold-dim: #B8960C;
    --silver: #C0C0C0;
    --bronze: #CD7F32;
    --white: #F0EDE8;
    --pink: #FF6B9D;
    --cyan: #00D4FF;
    --green: #39FF14;
    --purple: #9B59B6;
    --common-color: #7F8C8D;
    --uncommon-color: #27AE60;
    --rare-color: #2980B9;
    --epic-color: #8E44AD;
    --legendary-color: #F39C12;
    --mythic-color: #E74C3C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    cursor: default;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(107,15,26,0.03) 40px, rgba(107,15,26,0.03) 41px),
      repeating-linear-gradient(-45deg, transparent, transparent 40px, rgba(107,15,26,0.03) 40px, rgba(107,15,26,0.03) 41px);
    pointer-events: none;
    z-index: 0;
  }

  /* ── HEADER ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: linear-gradient(180deg, #0A0A0A 0%, rgba(10,10,10,0.95) 100%);
    border-bottom: 2px solid var(--maroon);
    padding: 0 2rem;
    display: flex; align-items: center; gap: 2rem;
    height: 64px;
    box-shadow: 0 4px 30px rgba(107,15,26,0.4);
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 4px;
    background: linear-gradient(135deg, var(--maroon-glow), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    white-space: nowrap;
  }

  .nav-tabs {
    display: flex; gap: 0.5rem; flex: 1;
  }

  .nav-tab {
    padding: 0.4rem 1.2rem;
    background: transparent;
    border: 1px solid var(--black-border);
    border-radius: 4px;
    color: var(--white);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .nav-tab:hover, .nav-tab.active {
    background: var(--maroon);
    border-color: var(--maroon-glow);
    box-shadow: 0 0 12px rgba(178,34,52,0.4);
    color: #fff;
  }

  .search-wrap {
    display: flex; gap: 0.5rem;
  }
  #searchInput {
    background: var(--black-panel);
    border: 1px solid var(--maroon);
    border-radius: 4px;
    color: var(--white);
    padding: 0.4rem 0.8rem;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.95rem;
    width: 200px;
    outline: none;
    transition: box-shadow 0.2s;
  }
  #searchInput:focus { box-shadow: 0 0 10px rgba(178,34,52,0.5); }
  #searchInput::placeholder { color: #555; }

  .btn {
    padding: 0.4rem 1rem;
    background: var(--maroon);
    border: 1px solid var(--maroon-glow);
    border-radius: 4px;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .btn:hover {
    background: var(--maroon-glow);
    box-shadow: 0 0 16px rgba(178,34,52,0.6);
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0); }
  .btn.gold { background: linear-gradient(135deg, #B8960C, #FFD700); border-color: #FFD700; color: #000; }
  .btn.gold:hover { box-shadow: 0 0 20px rgba(255,215,0,0.5); }
  .btn.danger { background: #3D0509; border-color: var(--maroon-glow); }

  /* ── SECTIONS ── */
  .section { display: none; padding: 2rem; position: relative; z-index: 1; }
  .section.active { display: block; }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.5rem;
    letter-spacing: 3px;
    color: var(--maroon-glow);
    margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 1rem;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, var(--maroon), transparent);
  }

  /* ── CARDS GRID ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1.5rem;
  }

  /* ── ANIME CARD ── */
  .anime-card {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    background: var(--black-card);
    border: 1px solid var(--black-border);
    transform-style: preserve-3d;
    animation: cardIn 0.4s ease backwards;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .anime-card:hover {
    transform: translateY(-6px) scale(1.02);
    z-index: 10;
  }
  .anime-card.rarity-Common    { box-shadow: 0 4px 15px rgba(127,140,141,0.3); border-color: var(--common-color); }
  .anime-card.rarity-Common:hover { box-shadow: 0 8px 25px rgba(127,140,141,0.5); }
  .anime-card.rarity-Uncommon  { box-shadow: 0 4px 15px rgba(39,174,96,0.3); border-color: var(--uncommon-color); }
  .anime-card.rarity-Uncommon:hover { box-shadow: 0 8px 25px rgba(39,174,96,0.5); }
  .anime-card.rarity-Rare      { box-shadow: 0 4px 15px rgba(41,128,185,0.3); border-color: var(--rare-color); }
  .anime-card.rarity-Rare:hover { box-shadow: 0 8px 25px rgba(41,128,185,0.6); }
  .anime-card.rarity-Epic      { box-shadow: 0 4px 15px rgba(142,68,173,0.4); border-color: var(--epic-color); }
  .anime-card.rarity-Epic:hover { box-shadow: 0 8px 25px rgba(142,68,173,0.7); }
  .anime-card.rarity-Legendary { box-shadow: 0 4px 20px rgba(243,156,18,0.5); border-color: var(--legendary-color); animation: legendaryPulse 2s infinite; }
  .anime-card.rarity-Mythic    { box-shadow: 0 4px 20px rgba(231,76,60,0.5); border-color: var(--mythic-color); animation: mythicPulse 1.5s infinite; }

  @keyframes legendaryPulse {
    0%,100% { box-shadow: 0 4px 20px rgba(243,156,18,0.5); }
    50%      { box-shadow: 0 4px 30px rgba(243,156,18,0.9); }
  }
  @keyframes mythicPulse {
    0%,100% { box-shadow: 0 4px 20px rgba(231,76,60,0.5); }
    50%      { box-shadow: 0 4px 35px rgba(231,76,60,1); }
  }

  .card-rarity-bar {
    height: 5px;
    width: 100%;
  }
  .rarity-Common    .card-rarity-bar { background: var(--common-color); }
  .rarity-Uncommon  .card-rarity-bar { background: linear-gradient(90deg, #27AE60, #2ECC71); }
  .rarity-Rare      .card-rarity-bar { background: linear-gradient(90deg, #2980B9, #3498DB); }
  .rarity-Epic      .card-rarity-bar { background: linear-gradient(90deg, #8E44AD, #9B59B6, #E056D1); }
  .rarity-Legendary .card-rarity-bar { background: linear-gradient(90deg, #F39C12, #FFD700, #FFF, #FFD700, #F39C12); background-size: 200%; animation: shimmer 2s infinite linear; }
  .rarity-Mythic    .card-rarity-bar { background: linear-gradient(90deg, #E74C3C, #FF0090, #E74C3C); background-size: 200%; animation: shimmer 1.2s infinite linear; }

  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  .card-header {
    padding: 0.5rem 0.6rem 0.3rem;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.75rem;
  }
  .card-type-badge {
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--black-border);
    border-radius: 3px;
    padding: 0.1rem 0.4rem;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    color: #aaa;
  }
  .card-score {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    color: var(--gold);
    letter-spacing: 1px;
  }

  .card-img-wrap {
    position: relative;
    width: 100%; height: 200px;
    overflow: hidden;
    background: var(--maroon-deep);
  }
  .card-img-wrap img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.4s;
  }
  .anime-card:hover .card-img-wrap img { transform: scale(1.08); }

  /* Diagonal stripe overlay (like the sample card) */
  .card-img-wrap::after {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      -45deg,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 8px,
      rgba(0,0,0,0.08) 8px,
      rgba(0,0,0,0.08) 10px
    );
    pointer-events: none;
  }

  .card-studio {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.7);
    padding: 0.2rem 0.5rem;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: #aaa;
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .card-title-area {
    padding: 0.4rem 0.6rem 0.2rem;
    background: rgba(0,0,0,0.3);
  }
  .card-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.15rem;
    letter-spacing: 1px;
    line-height: 1.1;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
  }
  .card-subtitle {
    font-size: 0.7rem;
    color: #bbb;
    font-style: italic;
    margin-top: 0.1rem;
  }

  .card-genres {
    padding: 0.3rem 0.6rem;
    display: flex; flex-wrap: wrap; gap: 0.3rem;
  }
  .genre-tag {
    padding: 0.1rem 0.5rem;
    border-radius: 20px;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    border: 1px solid;
  }
  .genre-tag.Drama    { background: rgba(231,76,60,0.15); border-color: #E74C3C; color: #E74C3C; }
  .genre-tag.Romance  { background: rgba(255,107,157,0.15); border-color: #FF6B9D; color: #FF6B9D; }
  .genre-tag.School   { background: rgba(41,128,185,0.15); border-color: #3498DB; color: #3498DB; }
  .genre-tag.Action   { background: rgba(243,156,18,0.15); border-color: #F39C12; color: #F39C12; }
  .genre-tag.Fantasy  { background: rgba(142,68,173,0.15); border-color: #9B59B6; color: #9B59B6; }
  .genre-tag.Comedy   { background: rgba(39,174,96,0.15); border-color: #27AE60; color: #27AE60; }
  .genre-tag.Sci-Fi, .genre-tag[class*="Sci"]   { background: rgba(0,212,255,0.15); border-color: #00D4FF; color: #00D4FF; }
  .genre-tag.Horror   { background: rgba(61,5,9,0.4); border-color: #8B0000; color: #FF4444; }
  .genre-tag.Mystery  { background: rgba(80,80,80,0.2); border-color: #888; color: #ccc; }
  .genre-tag { background: rgba(107,15,26,0.2); border-color: var(--maroon); color: #daa; }

  .card-stats {
    padding: 0.4rem 0.6rem;
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 0.3rem;
    border-top: 1px solid var(--black-border);
  }
  .stat-item { text-align: center; }
  .stat-label {
    font-size: 0.6rem;
    color: var(--maroon-glow);
    font-family: 'Share Tech Mono', monospace;
    text-transform: uppercase;
  }
  .stat-value { font-size: 0.85rem; font-weight: 700; color: #fff; }

  .card-desc {
    padding: 0.4rem 0.6rem;
    font-size: 0.72rem;
    color: #999;
    line-height: 1.4;
    border-top: 1px solid var(--black-border);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-footer {
    padding: 0.4rem 0.6rem;
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(107,15,26,0.1);
    border-top: 1px solid var(--black-border);
  }
  .card-community {
    font-size: 0.65rem;
    color: #666;
    font-family: 'Share Tech Mono', monospace;
  }
  .card-rarity-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 1px;
  }
  .rarity-Common    .card-rarity-label { color: var(--common-color); }
  .rarity-Uncommon  .card-rarity-label { color: var(--uncommon-color); }
  .rarity-Rare      .card-rarity-label { color: var(--rare-color); }
  .rarity-Epic      .card-rarity-label { color: var(--epic-color); }
  .rarity-Legendary .card-rarity-label { color: var(--legendary-color); }
  .rarity-Mythic    .card-rarity-label { color: var(--mythic-color); }

  /* ── SKELETON ── */
  .skeleton-card {
    border-radius: 10px; background: var(--black-card);
    border: 1px solid var(--black-border);
    overflow: hidden;
  }
  .skeleton-block {
    background: linear-gradient(90deg, #1a1a1f 25%, #252530 50%, #1a1a1f 75%);
    background-size: 400% 100%;
    animation: skeletonWave 1.4s ease infinite;
    border-radius: 3px;
  }
  @keyframes skeletonWave {
    0%   { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .sk-img   { height: 200px; }
  .sk-h     { height: 18px; margin: 0.4rem 0.6rem 0.2rem; }
  .sk-h.sm  { height: 12px; width: 60%; }
  .sk-p     { height: 10px; margin: 0.2rem 0.6rem; }
  .sk-row   { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.3rem; padding: 0.4rem 0.6rem; }
  .sk-stat  { height: 30px; }

  /* ── LOAD MORE ── */
  .load-more-wrap { text-align: center; margin-top: 2rem; }

  /* ── GACHA SECTION ── */
  #gacha-section { text-align: center; }
  .gacha-machine {
    max-width: 600px; margin: 0 auto;
    background: linear-gradient(135deg, var(--maroon-deep), var(--black-panel));
    border: 2px solid var(--maroon);
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 0 40px rgba(107,15,26,0.5);
    position: relative;
    overflow: hidden;
  }
  .gacha-machine::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      -45deg, transparent, transparent 20px,
      rgba(255,255,255,0.01) 20px, rgba(255,255,255,0.01) 21px
    );
  }
  .gacha-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem; letter-spacing: 4px;
    background: linear-gradient(135deg, var(--gold), #fff, var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    text-shadow: none;
    margin-bottom: 0.5rem;
  }
  .gacha-subtitle { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
  .gacha-window {
    width: 220px; height: 300px; margin: 0 auto 1.5rem;
    background: rgba(0,0,0,0.6);
    border: 3px solid var(--maroon);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 0 20px rgba(107,15,26,0.5);
  }
  .gacha-window .question-mark {
    font-size: 5rem;
    color: var(--maroon);
    animation: pulse 2s infinite;
    user-select: none;
  }
  @keyframes pulse { 0%,100%{opacity:0.5;transform:scale(1)} 50%{opacity:1;transform:scale(1.1)} }

  .gacha-result-card {
    width: 100%; height: 100%;
    display: none;
    flex-direction: column;
    position: absolute; inset: 0;
  }
  .gacha-result-card.show { display: flex; animation: gachaReveal 0.6s ease; }
  @keyframes gachaReveal {
    0%   { transform: scale(0) rotateY(180deg); opacity: 0; }
    60%  { transform: scale(1.1) rotateY(0deg); opacity: 1; }
    100% { transform: scale(1); }
  }
  .gacha-result-img { flex: 1; object-fit: cover; width: 100%; }
  .gacha-result-name {
    padding: 0.4rem;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    text-align: center;
    letter-spacing: 1px;
  }

  .gacha-btn-wrap { display: flex; gap: 1rem; justify-content: center; }
  .gacha-used-msg { color: var(--maroon-glow); font-weight: 700; font-size: 1.1rem; margin-top: 1rem; }

  .pull-result-info {
    margin-top: 1rem;
    padding: 1rem;
    background: rgba(0,0,0,0.4);
    border-radius: 8px;
    border: 1px solid var(--black-border);
    text-align: left;
    display: none;
  }
  .pull-result-info.show { display: block; animation: fadeIn 0.5s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  .pull-rarity-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem; letter-spacing: 3px;
    text-align: center; margin-bottom: 0.5rem;
  }
  .pull-name { font-size: 1.1rem; font-weight: 700; text-align: center; margin-bottom: 0.3rem; }
  .pull-series { font-size: 0.85rem; color: #888; text-align: center; }

  .particle { position: absolute; pointer-events: none; border-radius: 50%; animation: particleFly 1s ease-out forwards; }
  @keyframes particleFly {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  /* ── BATTLE SECTION ── */
  #battle-section { max-width: 900px; margin: 0 auto; }
  .battle-arena {
    background: linear-gradient(180deg, var(--maroon-deep) 0%, var(--black) 100%);
    border: 2px solid var(--maroon);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .battle-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem; letter-spacing: 3px;
    text-align: center; color: var(--maroon-glow);
    margin-bottom: 1.5rem;
  }
  .battle-field {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 1rem; align-items: center;
  }
  .battle-side { text-align: center; }
  .battle-side-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem; letter-spacing: 2px;
    color: #888; margin-bottom: 0.5rem;
  }
  .battle-card-display {
    width: 160px; height: 220px; margin: 0 auto;
    background: var(--black-card);
    border: 2px solid var(--black-border);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    transition: all 0.3s;
  }
  .battle-card-display img { width: 100%; height: 100%; object-fit: cover; }
  .battle-card-name {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.8);
    padding: 0.3rem 0.4rem;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem; letter-spacing: 1px;
    text-align: center;
  }
  .battle-vs {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem; color: var(--maroon-glow);
    text-shadow: 0 0 20px rgba(178,34,52,0.8);
    animation: vsPulse 1s infinite;
  }
  @keyframes vsPulse { 0%,100%{text-shadow:0 0 20px rgba(178,34,52,0.8)} 50%{text-shadow:0 0 40px rgba(178,34,52,1)} }

  .battle-hp-bar {
    margin: 0.8rem 0;
    background: #1a1a1f;
    border-radius: 4px; height: 12px;
    border: 1px solid var(--black-border);
    overflow: hidden;
    position: relative;
  }
  .battle-hp-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s ease;
  }
  .battle-hp-fill.player { background: linear-gradient(90deg, var(--maroon), var(--maroon-glow)); }
  .battle-hp-fill.bot    { background: linear-gradient(90deg, #2c3e50, #3498db); }
  .battle-hp-text {
    text-align: center;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem; color: #888;
    margin-top: 0.2rem;
  }

  .battle-log {
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--black-border);
    border-radius: 6px;
    padding: 0.8rem 1rem;
    height: 130px;
    overflow-y: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    margin-top: 1rem;
  }
