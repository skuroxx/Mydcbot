<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PokéQuest RPG</title>
    <style>
        :root {
            --bg: #0b0e11;
            --card: #1a1d23;
            --accent: #ffcb05;
            --hp-color: #2ecc71;
            --energy-color: #3498db;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        /* --- Global UI --- */
        .header {
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .view { width: 100%; max-width: 450px; padding: 20px; display: none; padding-bottom: 100px; box-sizing: border-box; }
        .active { display: block; animation: fadeIn 0.3s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- Energy & Bars --- */
        .stat-row { font-size: 0.8rem; margin: 5px 0; }
        .bar-bg { background: #333; height: 10px; border-radius: 5px; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 0.4s ease-out; }

        /* --- Interaction Hub --- */
        .hub-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            background: var(--card);
            border: 1px solid #444;
            color: white;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .action-btn:disabled { opacity: 0.5; filter: grayscale(1); }
        .action-btn:active:not(:disabled) { transform: scale(0.95); }

        /* --- Battle Scene --- */
        .battle-arena {
            background: linear-gradient(to bottom, #2c3e50, #000);
            height: 300px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            border: 2px solid #444;
        }

        .battle-side { position: absolute; width: 120px; transition: 0.3s; }
        .enemy { top: 20px; right: 20px; }
        .player { bottom: 20px; left: 20px; }

        /* --- Bottom Nav --- */
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 450px;
            background: #1a1d23;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 2px solid #333;
        }

        nav button { background: none; border: none; color: #777; font-weight: bold; }
        nav button.active { color: var(--accent); }

        .log {
            background: rgba(0,0,0,0.5);
            height: 80px;
            overflow-y: auto;
            font-size: 0.8rem;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>💰 $<span id="money">0</span></div>
        <div>⚡ Energy: <span id="energy">10</span>/10</div>
    </div>

    <div id="home" class="view active">
        <div id="active-card-container" style="text-align: center;">
            <img id="poke-img" src="" style="width: 200px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));">
            <h2 id="poke-name">---</h2>
            <div class="stat-row">XP Level <span id="poke-lvl">1</span></div>
            <div class="bar-bg"><div id="xp-bar" class="bar-fill" style="background: var(--accent);"></div></div>
        </div>

        <div class="hub-grid">
            <button class="action-btn" onclick="interact('feed')">🍎 Feed<br><small>+10 Energy (-$10)</small></button>
            <button class="action-btn" onclick="interact('play')">🎾 Play<br><small>+20 XP (-2 Energy)</small></button>
            <button class="action-btn" onclick="interact('train')">⚔️ Train<br><small>+50 XP (-5 Energy)</small></button>
            <button class="action-btn" onclick="startQuest()">📜 Quest<br><small>Earn $50 (-3 Energy)</small></button>
        </div>
    </div>

    <div id="battle" class="view">
        <div class="battle-arena">
            <div class="battle-side enemy">
                <div id="enemy-hp-bar" class="bar-bg"><div class="bar-fill" style="background: var(--hp-color); width:100%"></div></div>
                <img id="enemy-img" src="" style="width: 100%;">
            </div>
            <div class="battle-side player">
                <img id="player-img" src="" style="width: 100%;">
                <div id="player-hp-bar" class="bar-bg"><div class="bar-fill" style="background: var(--hp-color); width:100%"></div></div>
            </div>
        </div>
        <div id="battle-log" class="log">Searching for opponent...</div>
        <div class="hub-grid" id="battle-btns" style="display: none;">
            <button class="action-btn" onclick="attack()">Physical Attack</button>
            <button class="action-btn" onclick="specialAttack()">Special Move</button>
        </div>
        <button id="find-battle" class="btn-action" style="width:100%; margin-top:20px; padding:15px; background:var(--accent); border-radius:10px;" onclick="initBattle()">Find Trainer Battle</button>
    </div>

    <div id="shop" class="view">
        <h2>PokeMart</h2>
        <div class="action-btn" style="width: 100%; margin-bottom: 10px;" onclick="buyPack()">
            🎁 Booster Pack ($200)<br><small>Get a random new Pokemon</small>
        </div>
        <div class="action-btn" style="width: 100%;" onclick="buyItem('rare-candy')">
            🍬 Rare Candy ($500)<br><small>Instant Level Up!</small>
        </div>
    </div>

    <nav>
        <button onclick="showView('home')" id="n-home" class="active">HOME</button>
        <button onclick="showView('battle')" id="n-battle">BATTLE</button>
        <button onclick="showView('shop')" id="n-shop">SHOP</button>
    </nav>

    <script>
        // --- GAME STATE ---
        let state = JSON.parse(localStorage.getItem('pokeRPG')) || {
            money: 100,
            energy: 10,
            activeIdx: 0,
            inventory: []
        };

        let battleState = null;

        // --- CORE ENGINE ---
        async function init() {
            if (state.inventory.length === 0) {
                await addPokemon(4); // Charmander starter
            }
            updateUI();
        }

        async function addPokemon(id) {
            const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
            const data = await res.json();
            state.inventory.push({
                id: data.id,
                name: data.name,
                sprite: data.sprites.other['official-artwork'].front_default,
                lvl: 1,
                xp: 0,
                hp: data.stats[0].base_stat,
                atk: data.stats[1].base_stat,
                def: data.stats[2].base_stat,
                type: data.types[0].type.name
            });
            save();
        }

        function interact(type) {
            let p = state.inventory[state.activeIdx];
            if (type === 'feed' && state.money >= 10) {
                state.money -= 10;
                state.energy = Math.min(10, state.energy + 3);
                log("Fed your buddy! Energy restored.");
            } else if (type === 'play' && state.energy >= 2) {
                state.energy -= 2;
                gainXP(20);
            } else if (type === 'train' && state.energy >= 5) {
                state.energy -= 5;
                gainXP(60);
            } else {
                alert("Not enough Energy or Money!");
            }
            save();
        }

        function gainXP(amt) {
            let p = state.inventory[state.activeIdx];
            p.xp += amt;
            if (p.xp >= 100) {
                p.xp = 0;
                p.lvl++;
                p.hp += 5; p.atk += 2;
                log(`${p.name} leveled up to ${p.lvl}!`);
                checkEvolution(p);
            }
        }

        async function startQuest() {
            if(state.energy < 3) return alert("Too tired!");
            state.energy -= 3;
            log("Sending on quest...");
            setTimeout(() => {
                state.money += 50;
                log("Quest complete! Earned $50.");
                save();
            }, 1000);
        }

        // --- BATTLE SYSTEM ---
        async function initBattle() {
            document.getElementById('find-battle').style.display = 'none';
            document.getElementById('battle-btns').style.display = 'grid';
            
            const enemyId = Math.floor(Math.random() * 150) + 1;
            const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${enemyId}`);
            const data = await res.json();
            
            const player = state.inventory[state.activeIdx];
            battleState = {
                player: { ...player, currentHp: player.hp + (player.lvl * 2) },
                enemy: { 
                    name: data.name, 
                    sprite: data.sprites.front_default, 
                    hp: data.stats[0].base_stat, 
                    currentHp: data.stats[0].base_stat,
                    atk: data.stats[1].base_stat 
                }
            };

            document.getElementById('enemy-img').src = battleState.enemy.sprite;
            document.getElementById('player-img').src = battleState.player.sprite;
            logBattle(`A wild ${battleState.enemy.name} appeared!`);
            updateBattleUI();
        }

        function attack() {
            // Player attacks
            let dmg = Math.floor(battleState.player.atk / 5) + (battleState.player.lvl);
            battleState.enemy.currentHp -= dmg;
            logBattle(`You dealt ${dmg} damage!`);
            
            if (battleState.enemy.currentHp <= 0) return winBattle();
            
            // Enemy attacks back
            setTimeout(() => {
                let eDmg = Math.floor(battleState.enemy.atk / 7);
                battleState.player.currentHp -= eDmg;
                logBattle(`${battleState.enemy.name} hits back for ${eDmg}!`);
                if (battleState.player.currentHp <= 0) return loseBattle();
                updateBattleUI();
            }, 600);
        }

        function winBattle() {
            logBattle("Victory! Gained $100 and 100 XP.");
            state.money += 100;
            gainXP(100);
            resetBattle();
        }

        function loseBattle() {
            logBattle("Defeat... you fainted.");
            resetBattle();
        }

        function resetBattle() {
            save();
            battleState = null;
            setTimeout(() => {
                document.getElementById('find-battle').style.display = 'block';
                document.getElementById('battle-btns').style.display = 'none';
            }, 2000);
        }

        // --- UTILS ---
        function log(msg) { console.log(msg); updateUI(); }
        function logBattle(msg) { document.getElementById('battle-log').innerText = msg; }
        
        function updateUI() {
            let p = state.inventory[state.activeIdx];
            document.getElementById('money').innerText = state.money;
            document.getElementById('energy').innerText = state.energy;
            document.getElementById('poke-name').innerText = p.name.toUpperCase();
            document.getElementById('poke-img').src = p.sprite;
            document.getElementById('poke-lvl').innerText = p.lvl;
            document.getElementById('xp-bar').style.width = p.xp + '%';
        }

        function updateBattleUI() {
            const pPct = (battleState.player.currentHp / (battleState.player.hp + (battleState.player.lvl * 2))) * 100;
            const ePct = (battleState.enemy.currentHp / battleState.enemy.hp) * 100;
            document.querySelector('.player .bar-fill').style.width = pPct + '%';
            document.querySelector('.enemy .bar-fill').style.width = ePct + '%';
        }

        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('n-' + id).classList.add('active');
        }

        function save() {
            localStorage.setItem('pokeRPG', JSON.stringify(state));
            updateUI();
        }

        init();
    </script>
</body>
</html>
