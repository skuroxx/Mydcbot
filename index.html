<!DOCTYPE html>
<html>
<head>
    <title>Payment System</title>
</head>
<body>

<div id="login">
    <h2>Login</h2>
    <input id="username" placeholder="Username">
    <button onclick="login()">Login</button>
</div>

<div id="payment" style="display:none;">
    <h2>Scan & Pay</h2>
    <img src="your-qr.png" width="200">
    <p id="status">Waiting for payment...</p>

    <button onclick="showManual()">I Paid</button>

    <div id="manual" style="display:none;">
        <input id="txn" placeholder="Transaction ID">
        <input id="amt" placeholder="Amount">
        <input type="file" id="file">
        <button onclick="submitProof()">Submit</button>
    </div>
</div>

<div id="dashboard" style="display:none;">
    <h1>Welcome 🎉</h1>
    <p>Payment successful</p>
</div>

<script>
const API = "http://YOUR_VPS:3000";
let token = localStorage.getItem("token");

// ================= LOGIN =================
async function login() {
    const username = document.getElementById("username").value;

    const res = await fetch(API + "/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username })
    });

    const data = await res.json();
    token = data.token;
    localStorage.setItem("token", token);

    showPayment();
}

// ================= UI =================
function showPayment() {
    document.getElementById("login").style.display = "none";
    document.getElementById("payment").style.display = "block";
    startCheck();
}

function showDashboard() {
    document.getElementById("payment").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
}

// ================= AUTO CHECK =================
function startCheck() {
    setInterval(async () => {
        const res = await fetch(API + "/payment-status", {
            headers: { authorization: token }
        });

        const data = await res.json();
        if (data.paid) showDashboard();
    }, 5000);
}

// ================= MANUAL =================
function showManual() {
    document.getElementById("manual").style.display = "block";
}

async function submitProof() {
    const form = new FormData();
    form.append("txnId", document.getElementById("txn").value);
    form.append("amount", document.getElementById("amt").value);
    form.append("screenshot", document.getElementById("file").files[0]);

    await fetch(API + "/submit-proof", {
        method: "POST",
        headers: { authorization: token },
        body: form
    });

    alert("Submitted for review");
}

// ================= AUTO LOGIN =================
if (token) showPayment();
</script>

</body>
</html>
