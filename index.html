<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Bot | Anime Gacha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background: #0a0505; color: #e5d7d7; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* The Trading Card Outer Border (Gold Foil look) */
        .tcg-card {
            background: linear-gradient(135deg, #ffd700 0%, #daa520 50%, #b8860b 100%);
            padding: 12px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(255, 215, 0, 0.2), inset 0 0 10px rgba(255,255,255,0.5);
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
            transition: transform 0.3s;
        }
        
        .tcg-card:hover { transform: translateY(-10px); }

        /* The Inside of the Card */
        .tcg-inner {
            background: #1a0f0f;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #3e2723;
            display: flex;
            flex-col;
            height: 100%;
        }

        /* The Character Image */
        .tcg-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-bottom: 4px solid #ffd700;
            background: #000;
        }

        /* The Roll Button */
        .btn-roll {
            background: linear-gradient(135deg, #800000 0%, #460000 100%);
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(128, 0, 0, 0.5);
        }
        .btn-roll:hover { box-shadow: 0 5px 25px rgba(255, 0, 0, 0.5); transform: scale(1.05); }
        .btn-roll:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <div class="text-center mb-8">
        <h1 class="text-4xl font-black text-white mb-2 uppercase tracking-widest"><i class="fas fa-dragon text-red-600"></i> Ada Gacha</h1>
        <p class="text-gray-400 text-sm">Pull random anime cards using the Jikan API</p>
    </div>

    <div class="tcg-card" id="card-container" style="display: none;">
        <div class="tcg-inner flex flex-col">
            <div class="flex justify-between items-center p-3 bg-gradient-to-r from-red-900 to-[#1a0f0f]">
                <h2 id="char-name" class="font-black text-white truncate text-lg">Character Name</h2>
                <span class="text-yellow-400 font-bold text-sm"><i class="fas fa-star"></i> SSR</span>
            </div>
            
            <img id="char-img" class="tcg-image" src="" alt="Character Image">
            
            <div class="p-4 bg-[#1a0f0f] flex-1">
                <div class="flex justify-between text-[10px] text-gray-400 uppercase tracking-widest mb-2 border-b border-gray-800 pb-2">
                    <span>ATK: <span id="stat-atk" class="text-white font-bold">100</span></span>
                    <span>DEF: <span id="stat-def" class="text-white font-bold">100</span></span>
                </div>
                <p id="char-desc" class="text-xs text-gray-300 h-16 overflow-hidden line-clamp-4 leading-relaxed">
                    Character description will appear here...
                </p>
            </div>
        </div>
    </div>

    <div class="mt-8">
        <button id="roll-btn" onclick="pullCard()" class="btn-roll text-white font-black px-10 py-4 rounded-full text-lg flex items-center gap-3">
            <i class="fas fa-dice"></i> <span>Roll Machine</span>
        </button>
    </div>

    <script>
        async function pullCard() {
            const btn = document.getElementById('roll-btn');
            const card = document.getElementById('card-container');
            const img = document.getElementById('char-img');
            const name = document.getElementById('char-name');
            const desc = document.getElementById('char-desc');
            const atk = document.getElementById('stat-atk');
            const def = document.getElementById('stat-def');

            // 1. Loading State
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Rolling...';
            btn.disabled = true;

            try {
                // 2. Call the free Jikan API
                const response = await fetch('https://api.jikan.moe/v4/random/characters');
                const json = await response.json();
                const character = json.data;

                // 3. Update the HTML with the character data
                name.innerText = character.name;
                img.src = character.images.jpg.image_url;
                
                // Format description (handle empty bios)
                if (character.about) {
                    // Remove basic markdown/spoilers Jikan sometimes returns
                    let cleanDesc = character.about.replace(/\\n/g, ' ').substring(0, 150) + '...';
                    desc.innerText = cleanDesc;
                } else {
                    desc.innerText = "No database information found for this character.";
                }

                // Generate random stats for fun
                atk.innerText = Math.floor(Math.random() * 9000) + 1000;
                def.innerText = Math.floor(Math.random() * 9000) + 1000;

                // 4. Reveal the card
                card.style.display = 'block';

            } catch (error) {
                alert("The API is currently busy. Please try again in a few seconds!");
                console.error(error);
            }

            // 5. Reset the button
            btn.innerHTML = '<i class="fas fa-dice"></i> Roll Again';
            btn.disabled = false;
        }
    </script>
</body>
</html>
