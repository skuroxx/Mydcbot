<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Bot | Secure Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        [x-cloak] { display: none !important; }
        :root { --maroon: #800000; --dark: #0a0505; }
        body { background: var(--dark); color: #e5d7d7; font-family: sans-serif; }
        
        .btn-maroon {
            background: linear-gradient(135deg, #800000 0%, #460000 100%);
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-maroon:hover { box-shadow: 0 0 15px rgba(128, 0, 0, 0.6); transform: translateY(-2px); }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body x-data="{ 
    isLoggedIn: false, 
    user: { name: 'User', tag: '0001', avatar: 'https://cdn.discordapp.com/embed/avatars/0.png' } 
}">

    <nav class="fixed w-full z-50 glass-card px-6 py-4 flex justify-between items-center border-b border-white/5">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 btn-maroon rounded-xl flex items-center justify-center font-bold">A</div>
            <span class="font-black tracking-tighter text-xl">ADA BOT</span>
        </div>

        <div>
            <template x-if="!isLoggedIn">
                <a href="PASTE_YOUR_OAUTH2_URL_HERE" 
                   @click.prevent="isLoggedIn = true" 
                   class="flex items-center space-x-2 bg-[#5865F2] hover:bg-[#4752c4] px-6 py-2.5 rounded-xl font-bold transition">
                    <i class="fab fa-discord"></i>
                    <span>Login</span>
                </a>
            </template>

            <template x-if="isLoggedIn">
                <div class="flex items-center space-x-4">
                    <div class="text-right hidden sm:block">
                        <p class="text-sm font-bold" x-text="user.name"></p>
                        <p class="text-[10px] text-red-500 font-mono" x-text="'#' + user.tag"></p>
                    </div>
                    <img :src="user.avatar" class="w-10 h-10 rounded-full border-2 border-red-800">
                    <button @click="isLoggedIn = false" class="text-gray-500 hover:text-red-500 text-sm"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </template>
        </div>
    </nav>

    <main class="pt-28 p-6 max-w-6xl mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <aside class="space-y-4">
                <div class="glass-card p-6 rounded-3xl border-l-4 border-red-800">
                    <h3 class="font-bold mb-4 uppercase text-xs text-gray-500 tracking-widest">Navigation</h3>
                    <div class="space-y-2">
                        <button class="w-full text-left p-3 rounded-xl btn-maroon text-sm font-bold">Dashboard</button>
                        <button class="w-full text-left p-3 rounded-xl hover:bg-white/5 text-sm font-semibold">Server Settings</button>
                        <button class="w-full text-left p-3 rounded-xl hover:bg-white/5 text-sm font-semibold">Music Panel</button>
                    </div>
                </div>
            </aside>

            <section class="lg:col-span-2 space-y-6">
                <div class="glass-card p-8 rounded-[2.5rem]">
                    <h2 class="text-3xl font-black mb-6">Welcome to the Dashboard</h2>
                    
                    <div x-show="!isLoggedIn" class="bg-red-900/10 border border-red-900/20 p-6 rounded-2xl">
                        <p class="text-red-400 text-sm font-semibold">
                            <i class="fas fa-lock mr-2"></i> Access Restricted. Please log in with Discord to manage your server settings.
                        </p>
                    </div>

                    <div x-show="isLoggedIn" x-cloak class="space-y-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="bg-white/5 p-6 rounded-2xl border border-white/5">
                                <p class="text-gray-500 text-xs font-bold uppercase">Prefix</p>
                                <p class="text-2xl font-black mt-1">!</p>
                            </div>
                            <div class="bg-white/5 p-6 rounded-2xl border border-white/5">
                                <p class="text-gray-500 text-xs font-bold uppercase">Language</p>
                                <p class="text-2xl font-black mt-1">English (EN)</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

</body>
</html>
