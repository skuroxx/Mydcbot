<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PokéQuest RPG</title>
    <style>
        :root {
            --bg-dark: #090b0d;
            --surface: #1a1d23;
            --accent: #ffcb05;
            --hp-ok: #2ecc71;
            --hp-low: #e74c3c;
            --energy: #3498db;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        /* --- Header Stats --- */
        .header {
            width: 100%;
            max-width: 500px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            box-sizing: border-box;
        }

        .view { width: 100%; max-width: 500px; padding: 20px; display: none; padding-bottom: 100px; box-sizing: border-box; }
        .view.active { display: block; animation: slideUp 0.3s ease-out; }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* --- Bars --- */
        .bar-outer { background: #333; height: 10px; border-radius: 5px; margin: 5px 0; overflow: hidden; }
        .bar-inner { height: 100%; transition: width 0.3s ease; }

        /* --- Interaction Hub --- */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .action-card {
            background: var(--surface);
            border: 1px solid #333;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
        }
        .action-card:active { transform: scale(0.95); }
        .action-card:disabled { opacity: 0.5; cursor: not-allowed; }

        /* --- Battle Scene --- */
        .battle-stage {
            height: 250px;
            background: linear-gradient(180deg, #2c3e50 0%, #000 100%);
            border-radius: 20px;
            position: relative;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .fighter { position: absolute; width: 120px; transition: transform 0.2s; }
        .player-side { bottom: 20px; left: 20px; }
        .enemy-side { top: 20px; right: 20px; }
        
        .attack-anim { animation: attackMove 0.4s ease; }
        @keyframes attackMove { 0% { transform: translateX(0); } 50% { transform: translateX(50px); } 100% { transform: translateX(0); } }

        /* --- Pack Opening Animation --- */
        #gacha-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .shimmer-card {
            width: 250px; height: 350px;
            background: var(--accent);
            border-radius: 20px;
            animation: flipIn 1s forwards;
            box-shadow: 0 0 50px var(--accent);
        }
        @keyframes flipIn { 0% { transform: rotateY(0deg) scale(0); } 100% { transform: rotateY(1800deg) scale(1); } }

        /* --- Navigation --- */
        nav {
            position: fixed; bottom: 0; width: 100%; max-width: 500px;
            background: var(--surface);
            display: flex; justify-content: space-around;
            padding: 15px 0; border-top: 1px solid #333; z-index: 1000;
        }
        nav button { background: none; border: none; color: #666; font-weight: bold; font-size: 0.8rem; }
        nav button.active { color: var(--accent); }

        .type-fire { background: linear-gradient(135deg, #ee8130, #ff416c); }
        .type-water { background: linear-gradient(135deg, #6390f0, #0052d4); }
        .type-grass { background: linear-gradient(135deg, #7ac74c, #11998e); }
    </style>
</head>
<body>

    <div class="header">
        <div>💰 $<span id="wallet">0</span></div>
        <div style="text-align: right;">⚡ Energy: <span id="energy-val">10</span>/10</div>
    </div>

    <div id="home" class="view active">
        <div id="status-tag" style="text-align:center; color: #ff416c; font-weight: bold;"></div>
        <div style="text-align: center; margin: 20px 0;">
            <img id="main-sprite" src="" style="width: 180px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));">
            <h2 id="main-name" style="margin: 5px 0;">---</h2>
            <div style="font-size: 0.8rem; opacity: 0.7;">LEVEL <span id="main-lvl">1</span></div>
            <div class="bar-outer"><div id="main-xp" class="bar-inner" style="background: var(--accent); width: 0%;"></div></div>
        </div>

        <div class="btn-grid">
            <div class="action-card" onclick="playTask('quest')">📜 Quest<br><small>+$50 | -3⚡</small></div>
            <div class="action-card" onclick="playTask('train')">⚔️ Train<br><small>+40XP | -4⚡</small></div>
            <div class="action-card" onclick="playTask('feed')">🍎 Feed<br><small>+2⚡ | -$15</small></div>
            <div class="action-card" onclick="showView('pokedex')">📕 Dex<br><small>Switch Poke</small></div>
        </div>
    </div>

    <div id="battle" class="view">
        <div class="battle-stage">
            <div class="fighter enemy-side">
                <div class="bar-outer" style="width:80px;"><div id="enemy-hp" class="bar-inner" style="background:var(--hp-ok); width:100%"></div></div>
                <img id="enemy-sprite" src="" style="width: 100px;">
            </div>
            <div class="fighter player-side">
                <img id="player-sprite" src="" style="width: 100px;">
                <div class="bar-outer" style="width:80px;"><div id="player-hp" class="bar-inner" style="background:var(--hp-ok); width:100%"></div></div>
            </div>
        </div>
        <div id="battle-log" style="height: 60px; font-size: 0.85rem; background: #000; padding: 10px; border-radius: 10px; margin-bottom: 10px;">Ready to fight?</div>
        
        <div class="btn-grid" id="battle-ui">
            <button class="action-card" onclick="executeMove('atk')">Physical Atk</button>
            <button class="action-card" onclick="executeMove('sp')">Special Move</button>
        </div>
        <button id="find-battle-btn" class="action-card" style="width:100%; background:var(--accent); color:black; font-weight:bold" onclick="startRpgBattle()">FIND OPPONENT (-2⚡)</button>
    </div>

    <div id="shop" class="view">
        <h2>PokeMart</h2>
        <div class="action-card" style="margin-bottom: 10px; display:flex; justify-content:space-between;" onclick="buyPack()">
            <span>🎁 Great Booster Pack</span>
            <b>$250</b>
        </div>
        <div class="action-card" style="display:flex; justify-content:space-between;" onclick="buyItem('heal')">
            <span>💊 Max Revive</span>
            <b>$100</b>
        </div>
    </div>

    <div id="pokedex" class="view">
        <h2>Your Collection</h2>
        <div id="dex-list" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;"></div>
    </div>

    <div id="gacha-overlay">
        <div class="shimmer-card" id="gacha-card"></div>
        <h2 id="gacha-name">REVEALING...</h2>
        <button class="action-card" onclick="closeGacha()" style="background:white; color:black; margin-top:20px;">CLAIM</button>
    </div>

    <nav>
        <button id="n-home" class="active" onclick="showView('home')">HOME</button>
        <button id="n-battle" onclick="showView('battle')">BATTLE</button>
        <button id="n-shop" onclick="showView('shop')">SHOP</button>
    </nav>

    <script>
        // --- DATA & STATE ---
        let state = JSON.parse(localStorage.getItem('pokeRPG_Final')) || {
            money: 500,
            energy: 10,
            activeIdx: 0,
            inventory: []
        };

        let currentBattle = null;

        async function init() {
            if (state.inventory.length === 0) await addPoke(1); // Bulbasaur
            updateUI();
        }

        async function addPoke(id) {
            const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
            const data = await res.json();
            const p = {
                id: data.id,
                name: data.name,
                type: data.types[0].type.name,
                sprite: data.sprites.other['official-artwork'].front_default,
                lvl: 1, xp: 0, 
                hp: data.stats[0].base_stat,
                atk: data.stats[1].base_stat,
                def: data.stats[2].base_stat,
                fainted: false
            };
            state.inventory.push(p);
            save();
            return p;
        }

        // --- GAMEPLAY LOGIC ---
        function playTask(type) {
            const p = state.inventory[state.activeIdx];
            if (p.fainted) return alert("Your Pokemon is too tired. Heal it in the shop!");

            if (type === 'quest' && state.energy >= 3) {
                state.energy -= 3;
                state.money += 50;
                gainXP(20);
            } else if (type === 'train' && state.energy >= 4) {
                state.energy -= 4;
                gainXP(45);
            } else if (type === 'feed' && state.money >= 15) {
                state.money -= 15;
                state.energy = Math.min(10, state.energy + 2);
            } else {
                alert("Insufficient Resources!");
            }
            save();
        }

        function gainXP(amt) {
            const p = state.inventory[state.activeIdx];
            p.xp += amt;
            if (p.xp >= 100) {
                p.xp = 0;
                p.lvl++;
                p.hp += 10; p.atk += 3;
                alert(`${p.name} grew to Level ${p.lvl}!`);
            }
        }

        // --- BATTLE ENGINE ---
        async function startRpgBattle() {
            const player = state.inventory[state.activeIdx];
            if (state.energy < 2) return alert("No energy!");
            if (player.fainted) return alert("Pokemon is fainted!");

            state.energy -= 2;
            const enemyId = Math.floor(Math.random() * 151) + 1;
            const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${enemyId}`);
            const data = await res.json();

            currentBattle = {
                player: { ...player, curHp: player.hp },
                enemy: { 
                    name: data.name, 
                    sprite: data.sprites.front_default, 
                    hp: data.stats[0].base_stat, 
                    curHp: data.stats[0].base_stat,
                    atk: data.stats[1].base_stat 
                }
            };

            document.getElementById('find-battle-btn').style.display = 'none';
            document.getElementById('battle-ui').style.display = 'grid';
            document.getElementById('enemy-sprite').src = currentBattle.enemy.sprite;
            document.getElementById('player-sprite').src = currentBattle.player.sprite;
            updateBattleBars();
            save();
        }

        function executeMove(type) {
            // Player Turn
            const pDmg = type === 'atk' ? currentBattle.player.atk / 4 : currentBattle.player.atk / 2;
            currentBattle.enemy.curHp -= pDmg;
            document.getElementById('player-sprite').classList.add('attack-anim');
            logBattle(`Player used ${type.toUpperCase()}! Deals ${Math.floor(pDmg)} damage.`);

            setTimeout(() => {
                document.getElementById('player-sprite').classList.remove('attack-anim');
                if (currentBattle.enemy.curHp <= 0) return endBattle(true);

                // Enemy Turn
                const eDmg = currentBattle.enemy.atk / 5;
                currentBattle.player.curHp -= eDmg;
                logBattle(`${currentBattle.enemy.name} counters for ${Math.floor(eDmg)} damage!`);
                updateBattleBars();

                if (currentBattle.player.curHp <= 0) return endBattle(false);
            }, 600);
        }

        function endBattle(win) {
            if (win) {
                state.money += 150;
                gainXP(80);
                logBattle("VICTORY! +$150, +80XP");
            } else {
                state.inventory[state.activeIdx].fainted = true;
                logBattle("Your Pokemon fainted!");
            }
            setTimeout(() => {
                document.getElementById('find-battle-btn').style.display = 'block';
                document.getElementById('battle-ui').style.display = 'none';
                save();
            }, 2000);
        }

        // --- GACHA ---
        async function buyPack() {
            if (state.money < 250) return alert("No money!");
            state.money -= 250;
            const newId = Math.floor(Math.random() * 150) + 1;
            const p = await addPoke(newId);
            
            document.getElementById('gacha-overlay').style.display = 'flex';
            document.getElementById('gacha-name').innerText = p.name.toUpperCase();
            document.getElementById('gacha-card').className = `shimmer-card type-${p.type}`;
        }

        function closeGacha() {
            document.getElementById('gacha-overlay').style.display = 'none';
            showView('pokedex');
        }

        function buyItem(type) {
            if (type === 'heal' && state.money >= 100) {
                state.money -= 100;
                state.inventory.forEach(p => p.fainted = false);
                alert("All Pokemon Revived!");
                save();
            }
        }

        // --- UI HELPERS ---
        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('n-'+id.replace('pokedex','home')).classList.add('active');
            if (id === 'pokedex') renderDex();
        }

        function renderDex() {
            const list = document.getElementById('dex-list');
            list.innerHTML = state.inventory.map((p, i) => `
                <div class="action-card" onclick="setActive(${i})">
                    <img src="${p.sprite}" style="width:60px">
                    <div>${p.name}</div>
                    <small>${p.fainted ? 'FAINTED' : 'READY'}</small>
                </div>
            `).join('');
        }

        function setActive(i) {
            state.activeIdx = i;
            save();
            showView('home');
        }

        function updateUI() {
            const p = state.inventory[state.activeIdx];
            document.getElementById('wallet').innerText = state.money;
            document.getElementById('energy-val').innerText = state.energy;
            document.getElementById('main-sprite').src = p.sprite;
            document.getElementById('main-name').innerText = p.name.toUpperCase();
            document.getElementById('main-lvl').innerText = p.lvl;
            document.getElementById('main-xp').style.width = p.xp + '%';
            document.getElementById('status-tag').innerText = p.fainted ? "FAINTED - NEEDS HEAL" : "";
            document.getElementById('main-sprite').style.filter = p.fainted ? "grayscale(1) opacity(0.5)" : "none";
        }

        function updateBattleBars() {
            const pPct = (currentBattle.player.curHp / currentBattle.player.hp) * 100;
            const ePct = (currentBattle.enemy.curHp / currentBattle.enemy.hp) * 100;
            document.getElementById('player-hp').style.width = Math.max(0, pPct) + '%';
            document.getElementById('enemy-hp').style.width = Math.max(0, ePct) + '%';
        }

        function logBattle(m) { document.getElementById('battle-log').innerText = m; }
        function save() { localStorage.setItem('pokeRPG_Final', JSON.stringify(state)); updateUI(); }

        init();
    </script>
</body>
</html>
