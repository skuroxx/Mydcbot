<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Bot | Secure Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        [x-cloak] { display: none !important; }
        :root { --maroon: #800000; --dark: #0a0505; }
        body { background: var(--dark); color: #e5d7d7; font-family: sans-serif; margin: 0; }
        
        /* Fixes for the 'Huge Image' bug seen in your screenshot */
        img { max-width: 100%; height: auto; display: block; }
        .pfp-circle { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #800000; object-fit: cover; }

        .btn-maroon {
            background: linear-gradient(135deg, #800000 0%, #460000 100%);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-maroon:hover { box-shadow: 0 0 20px rgba(128, 0, 0, 0.6); transform: translateY(-2px); }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body x-data="{ 
    isLoggedIn: false, 
    activeCategory: 'music',
    showUserMenu: false,
    user: { name: 'Bot Master', avatar: 'https://cdn.discordapp.com/embed/avatars/0.png' } 
}" x-init="
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('code')) {
        isLoggedIn = true;
        // In a real bot, we would fetch your actual Discord name here.
        // For now, we unlock the UI so you can see the PFP and Dashboard.
        window.history.replaceState({}, document.title, window.location.pathname);
    }
">

    <nav class="fixed w-full z-50 glass-card px-6 py-4 flex justify-between items-center border-b border-white/5">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 btn-maroon rounded-xl flex items-center justify-center font-bold shadow-lg">A</div>
            <span class="font-black tracking-tighter text-xl hidden xs:block uppercase">Ada Bot</span>
        </div>

        <div class="flex items-center space-x-4">
            <template x-if="!isLoggedIn">
                <a href="https://discord.com/oauth2/authorize?client_id=1484845052063780964&response_type=code&redirect_uri=https%3A%2F%2Fskuroxx.github.io%2FMydcbot%2F&scope=identify+guilds" 
                   class="bg-[#5865F2] hover:bg-[#4752c4] px-6 py-2 rounded-xl font-bold transition text-sm">
                    Login with Discord
                </a>
            </template>

            <template x-if="isLoggedIn">
                <div class="flex items-center space-x-3 bg-white/5 p-1 pr-3 rounded-full border border-red-900/30">
                    <img :src="user.avatar" class="pfp-circle">
                    <span class="text-xs font-bold text-gray-300" x-text="user.name"></span>
                    <button @click="isLoggedIn = false" class="text-gray-600 hover:text-red-500 transition"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </template>
        </div>
    </nav>

    <main class="pt-28 p-6 max-w-6xl mx-auto flex flex-col lg:flex-row gap-8">
        
        <aside class="w-full lg:w-64 space-y-4">
            <div class="glass-card p-3 rounded-[2rem] space-y-1">
                <template x-for="cat in [
                    { id: 'music', label: 'Music', icon: 'fa-music' },
                    { id: 'mod', label: 'Moderation', icon: 'fa-shield-halved' },
                    { id: 'anime', label: 'Anime/Gacha', icon: 'fa-dragon' }
                ]">
                    <button @click="activeCategory = cat.id" 
                            :class="activeCategory === cat.id ? 'btn-maroon text-white' : 'text-gray-500 hover:bg-white/5'"
                            class="w-full flex items-center space-x-4 p-4 rounded-2xl font-bold transition">
                        <i class="fas w-5" :class="cat.icon"></i>
                        <span x-text="cat.label"></span>
                    </button>
                </template>
            </div>
        </aside>

        <section class="flex-1">
            <div class="glass-card p-8 rounded-[3rem] min-h-[500px]">
                <h2 class="text-2xl font-black mb-8 border-b border-white/5 pb-4 uppercase tracking-widest text-red-700" x-text="activeCategory"></h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <template x-if="activeCategory === 'music'">
                        <div class="contents">
                            <div class="bg-white/5 p-5 rounded-2xl border border-white/5">
                                <h4 class="font-bold text-red-500">!play</h4>
                                <p class="text-xs text-gray-500 mt-1">Plays high-fidelity audio with interactive cards.</p>
                            </div>
                            <div class="bg-white/5 p-5 rounded-2xl border border-white/5">
                                <h4 class="font-bold text-red-500">!lyrics</h4>
                                <p class="text-xs text-gray-500 mt-1">Fetches synced lyrics instantly.</p>
                            </div>
                        </div>
                    </template>
                    
                    <template x-if="activeCategory === 'mod'">
                        <div class="contents">
                            <div class="bg-white/5 p-5 rounded-2xl border border-white/5">
                                <h4 class="font-bold text-red-500">!warn</h4>
                                <p class="text-xs text-gray-500 mt-1">Issue a formal warning to a member.</p>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
