<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D PokéCard Sim</title>
    <style>
        :root {
            --gold: linear-gradient(45deg, #f3cf44, #f8e193, #f3cf44);
            --rare-gradient: linear-gradient(135deg, #6e8efb, #a777e3);
            --holo: linear-gradient(125deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 45%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0.3) 55%, rgba(255,255,255,0) 100%);
        }

        body {
            font-family: 'Helvetica Neue', sans-serif;
            background: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding-top: 20px;
        }

        /* --- Header & UI --- */
        .stats-bar {
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.8);
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            z-index: 100;
            border-bottom: 2px solid #333;
        }

        .money-text { color: #ffcb05; font-weight: bold; font-size: 1.2rem; }

        /* --- 3D Card Styling --- */
        .card-container {
            perspective: 1000px;
            margin: 20px;
        }

        .card {
            width: 240px;
            height: 330px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            cursor: pointer;
            border-radius: 15px;
            background: #222;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 6px solid #333;
        }

        .card.legendary { border: 6px solid #f3cf44; box-shadow: 0 0 15px #f3cf44; }

        .card-inner {
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
        }

        .card-img {
            width: 180px;
            height: 180px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 10px;
            image-rendering: pixelated;
        }

        .holo-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--holo);
            background-size: 200% 200%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .card:hover .holo-overlay { opacity: 0.5; }

        /* --- Collection Grid --- */
        #collection {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1200px;
            padding: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background: #ef5350;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background: #d32f2f; }
        button:disabled { background: #555; }
    </style>
</head>
<body>

    <div class="stats-bar">
        <div>💰 Money: <span id="money-val" class="money-text">0</span></div>
        <button id="pack-btn" onclick="buyPack()">Buy Booster Pack ($100)</button>
        <button onclick="work()">Work for Money (+$20)</button>
    </div>

    <h1>Your Collection</h1>
    <div id="collection"></div>

    <script>
        // --- GAME DATA & STORAGE ---
        let gameState = JSON.parse(localStorage.getItem('pokeSimData')) || {
            money: 500,
            collection: []
        };

        function saveGame() {
            localStorage.setItem('pokeSimData', JSON.stringify(gameState));
            updateUI();
        }

        // --- CORE LOGIC ---
        function work() {
            gameState.money += 20;
            saveGame();
        }

        async function buyPack() {
            if (gameState.money < 100) return alert("Not enough money!");
            
            gameState.money -= 100;
            const id = Math.floor(Math.random() * 151) + 1; // Gen 1
            
            const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
            const data = await response.json();
            
            // Evolution check (Optional simplification: just fetch species)
            const speciesRes = await fetch(data.species.url);
            const speciesData = await speciesRes.json();
            const evolvesFrom = speciesData.evolves_from_species ? speciesData.evolves_from_species.name : "Basic";

            const newCard = {
                id: data.id,
                name: data.name,
                sprite: data.sprites.other['official-artwork'].front_default,
                rarity: id > 140 ? 'legendary' : (id > 80 ? 'rare' : 'common'),
                from: evolvesFrom
            };

            gameState.collection.unshift(newCard);
            saveGame();
        }

        function updateUI() {
            document.getElementById('money-val').innerText = gameState.money;
            document.getElementById('pack-btn').disabled = gameState.money < 100;
            
            const container = document.getElementById('collection');
            container.innerHTML = '';

            gameState.collection.forEach(card => {
                const el = document.createElement('div');
                el.className = 'card-container';
                el.innerHTML = `
                    <div class="card ${card.rarity}" onmousemove="handleTilt(event, this)" onmouseleave="resetTilt(this)">
                        <div class="holo-overlay"></div>
                        <div class="card-inner">
                            <small style="opacity:0.7">${card.from.toUpperCase()}</small>
                            <img src="${card.sprite}" class="card-img">
                            <h3 style="margin:5px 0">${card.name.toUpperCase()}</h3>
                            <div style="font-size:0.8rem; color:#aaa">#${card.id}</div>
                        </div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        // --- 3D TILT EFFECT ---
        function handleTilt(e, card) {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = (centerY - y) / 10;
            const rotateY = (x - centerX) / 10;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            
            // Adjust holo position
            const holo = card.querySelector('.holo-overlay');
            holo.style.backgroundPosition = `${x}% ${y}%`;
        }

        function resetTilt(card) {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
        }

        // Initial Load
        updateUI();
    </script>
</body>
</html>
