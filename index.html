<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéPet Sim</title>
    <style>
        :root[data-theme="light"] {
            --bg: #f4f4f9;
            --card: #ffffff;
            --text: #333;
            --accent: #ef5350;
        }
        :root[data-theme="dark"] {
            --bg: #1a1a1a;
            --card: #2d2d2d;
            --text: #f0f0f0;
            --accent: #ffcb05;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.3s;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
        }

        .poke-img { width: 150px; height: 150px; image-rendering: pixelated; }
        
        .rarity-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .common { background: #a8a878; color: white; }
        .rare { background: #705898; color: white; }
        .legendary { background: #f08030; color: white; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(240, 128, 48, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(240, 128, 48, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(240, 128, 48, 0); }
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }

        .theme-toggle { position: absolute; top: 20px; right: 20px; }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>

    <div class="container">
        <div id="rarity" class="rarity-tag">Common</div>
        <div id="poke-container">
            <img id="poke-sprite" src="" alt="Loading..." class="poke-img">
            <h2 id="poke-name">Finding Pokémon...</h2>
        </div>
        
        <div class="stats">
            <p>Happiness: <span id="happy-val">100</span>%</p>
            <p>Level: <span id="lvl-val">1</span></p>
        </div>

        <button onclick="interact('feed')">Feed 🍎</button>
        <button onclick="interact('play')">Play 🎾</button>
        <hr>
        <button onclick="catchNew()">Catch New Pokémon</button>
    </div>

    <script>
        let currentPoke = {};
        let stats = { happiness: 100, level: 1 };

        async function catchNew() {
            // Rarity Logic: 1-70 Common, 71-95 Rare, 96-100 Legendary
            const roll = Math.floor(Math.random() * 100) + 1;
            let range = [1, 151]; // Defaults to Gen 1
            let rarityLabel = "Common";
            let rarityClass = "common";

            if (roll > 95) {
                // Legendary (Static IDs for demo)
                const legends = [144, 145, 146, 150, 151];
                id = legends[Math.floor(Math.random() * legends.length)];
                rarityLabel = "Legendary";
                rarityClass = "legendary";
            } else if (roll > 70) {
                // Rare (Mid-tier evolutions)
                id = Math.floor(Math.random() * 100) + 100;
                rarityLabel = "Rare";
                rarityClass = "rare";
            } else {
                // Common
                id = Math.floor(Math.random() * 80) + 1;
                rarityLabel = "Common";
                rarityClass = "common";
            }

            const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
            const data = await response.json();

            currentPoke = {
                name: data.name,
                sprite: data.sprites.front_default,
                rarity: rarityLabel,
                class: rarityClass
            };

            updateUI();
        }

        function updateUI() {
            document.getElementById('poke-name').innerText = currentPoke.name.toUpperCase();
            document.getElementById('poke-sprite').src = currentPoke.sprite;
            document.getElementById('rarity').innerText = currentPoke.rarity;
            document.getElementById('rarity').className = `rarity-tag ${currentPoke.class}`;
            document.getElementById('happy-val').innerText = stats.happiness;
            document.getElementById('lvl-val').innerText = stats.level;
        }

        function interact(type) {
            if (type === 'feed') stats.happiness = Math.min(100, stats.happiness + 10);
            if (type === 'play') {
                stats.happiness = Math.max(0, stats.happiness - 5);
                stats.level++;
            }
            updateUI();
        }

        function toggleTheme() {
            const root = document.documentElement;
            const current = root.getAttribute('data-theme');
            root.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
        }

        // Initialize
        catchNew();
    </script>
</body>
</html>
