<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Gacha | Ultimate Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background: #050205; color: #e5d7d7; overflow-x: hidden; font-family: sans-serif; }
        
        /* Slide Menu */
        #sidebar { transition: transform 0.3s ease-in-out; z-index: 50; }
        
        /* The Card */
        .ada-card {
            border: 2px solid var(--card-color, #800000);
            border-radius: 12px; padding: 10px; width: 100%; max-width: 380px; margin: 0 auto;
            background: repeating-linear-gradient(-45deg, #140a14, #140a14 10px, #0a050a 10px, #0a050a 20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .ada-inner { background: #0d060d; border: 1px solid #2a152a; border-radius: 8px; overflow: hidden; }
        .card-img-box { width: 100%; height: 350px; background: #000; position: relative; border-bottom: 2px solid #2a152a; }
        .card-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .tag-pill { background: var(--card-color, #800000); padding: 2px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: bold; color: white; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #800000; border-radius: 4px; }
        
        /* PVP Animations */
        .pvp-shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body class="flex h-screen">

    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-[#0a050a] border-r border-[#2a152a] transform -translate-x-full md:translate-x-0 md:relative flex flex-col">
        <div class="p-6 flex justify-between items-center border-b border-[#2a152a]">
            <h1 class="text-2xl font-black text-red-600 tracking-widest"><i class="fas fa-dragon mr-2"></i>ADA</h1>
            <button onclick="toggleMenu()" class="md:hidden text-gray-400"><i class="fas fa-times text-xl"></i></button>
        </div>
        <nav class="p-4 flex flex-col gap-2">
            <button onclick="switchView('home')" class="text-left p-3 rounded text-gray-300 hover:bg-[#140a14] font-bold"><i class="fas fa-random w-6"></i> Random Card</button>
            <button onclick="switchView('browse')" class="text-left p-3 rounded text-gray-300 hover:bg-[#140a14] font-bold"><i class="fas fa-search w-6"></i> Browse DB</button>
            <button onclick="switchView('gacha')" class="text-left p-3 rounded text-red-400 hover:bg-red-900/30 font-bold border border-red-900/50"><i class="fas fa-box-open w-6"></i> 1-Time Gacha</button>
            <button onclick="switchView('pvp')" class="text-left p-3 rounded text-gray-300 hover:bg-[#140a14] font-bold"><i class="fas fa-khanda w-6"></i> PVP Arena</button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <header class="md:hidden p-4 bg-[#0a050a] border-b border-[#2a152a] flex items-center sticky top-0 z-40">
            <button onclick="toggleMenu()" class="text-white mr-4"><i class="fas fa-bars text-xl"></i></button>
            <span class="font-black tracking-widest">ADA MENU</span>
        </header>

        <div id="view-home" class="p-6 w-full flex flex-col items-center min-h-full">
            <h2 class="text-2xl font-black mb-4">Random Entity</h2>
            <button onclick="buildRandomCard('home-card')" class="mb-6 bg-[#140a14] border border-[#2a152a] px-4 py-2 rounded hover:bg-gray-800 transition"><i class="fas fa-sync-alt mr-2"></i> Roll Again</button>
            <div id="home-card" class="w-full"></div>
        </div>

        <div id="view-browse" class="p-6 w-full flex flex-col items-center min-h-full hidden">
            <h2 class="text-2xl font-black mb-4">Database Browser</h2>
            <div class="flex gap-2 w-full max-w-md mb-6">
                <select id="b-type" class="bg-[#140a14] border border-[#2a152a] rounded p-2 text-white"><option value="anime">Anime</option><option value="characters">Character</option></select>
                <input type="text" id="b-query" placeholder="Search..." class="flex-1 bg-[#140a14] border border-[#2a152a] rounded p-2 text-white">
                <button onclick="runSearch()" class="bg-red-800 px-4 py-2 rounded font-bold"><i class="fas fa-search"></i></button>
            </div>
            <div id="b-results" class="grid grid-cols-2 md:grid-cols-3 gap-4 w-full max-w-2xl"></div>
            <div id="b-card-view" class="w-full hidden flex-col items-center">
                <button onclick="document.getElementById('b-results').classList.remove('hidden'); document.getElementById('b-card-view').classList.add('hidden');" class="mb-4 text-gray-400"><i class="fas fa-arrow-left mr-2"></i>Back</button>
                <div id="b-single-card" class="w-full"></div>
            </div>
        </div>

        <div id="view-gacha" class="p-6 w-full flex flex-col items-center min-h-full hidden">
            <h2 class="text-3xl font-black text-red-500 mb-2">MYSTERY PULL</h2>
            <p class="text-gray-400 text-sm mb-6 text-center max-w-sm">Pull 1 exclusive colored card and save it.</p>
            <button id="g-pull-btn" onclick="runGacha()" class="bg-red-700 hover:bg-red-600 text-white font-black py-4 px-8 rounded-xl mb-4 transition"><i class="fas fa-dice mr-2"></i> PULL CARD (1/1)</button>
            <button id="g-dl-btn" onclick="downloadCard()" class="bg-blue-700 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-xl mb-6 hidden"><i class="fas fa-download mr-2"></i> DOWNLOAD CARD</button>
            <div id="gacha-card" class="w-full hidden"></div>
        </div>

        <div id="view-pvp" class="p-6 w-full flex flex-col items-center min-h-full hidden">
            <h2 class="text-3xl font-black text-purple-500 mb-6">BATTLE ARENA</h2>
            <button id="p-summon-btn" onclick="setupPVP()" class="bg-[#140a14] border border-purple-900 px-6 py-2 rounded-lg font-bold mb-8"><i class="fas fa-users mr-2"></i> Summon Fighters</button>
            
            <div id="p-arena" class="w-full max-w-3xl flex justify-between items-center hidden gap-4">
                <div class="flex-1 bg-[#0d060d] border-2 border-blue-600 rounded-lg overflow-hidden text-center" id="p1-box">
                    <img id="p1-img" src="" class="w-full h-32 md:h-48 object-cover border-b-2 border-blue-600">
                    <div class="p-2">
                        <p id="p1-name" class="font-bold text-blue-300 text-sm truncate"></p>
                        <div class="w-full bg-gray-800 h-2 mt-2 rounded"><div id="p1-hp" class="bg-green-500 h-full rounded transition-all w-full"></div></div>
                    </div>
                </div>
                <div class="text-3xl font-black text-red-600">VS</div>
                <div class="flex-1 bg-[#0d060d] border-2 border-yellow-600 rounded-lg overflow-hidden text-center" id="p2-box">
                    <img id="p2-img" src="" class="w-full h-32 md:h-48 object-cover border-b-2 border-yellow-600">
                    <div class="p-2">
                        <p id="p2-name" class="font-bold text-yellow-300 text-sm truncate"></p>
                        <div class="w-full bg-gray-800 h-2 mt-2 rounded"><div id="p2-hp" class="bg-green-500 h-full rounded transition-all w-full"></div></div>
                    </div>
                </div>
            </div>
            <button id="p-fight-btn" onclick="runBattle()" class="mt-8 bg-red-700 px-10 py-3 rounded-xl font-black text-xl hidden"><i class="fas fa-fist-raised mr-2"></i> FIGHT!</button>
            <div id="p-log" class="mt-6 w-full max-w-xl bg-[#0a050a] border border-[#2a152a] rounded p-4 h-40 overflow-y-auto text-sm hidden"></div>
        </div>
    </main>

    <script>
        // --- 1. CORE SYSTEM & FALLBACKS ---
        const colors = ['#800000', '#003366', '#4b0082', '#004d00', '#8b6508'];
        let gachaPulled = false;
        let fighters = {};

        // Fallback data if Jikan API blocks the request
        const fallbackData = {
            title: "Ada System Override", title_japanese: "API Blocked",
            images: { jpg: { large_image_url: "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=400&q=80" } },
            score: 9.99, episodes: "∞", year: 2026, source: "System",
            synopsis: "The Jikan API rate limit was triggered. This is a secure fallback card to prevent the interface from crashing.",
            genres: [{name: "Cyberpunk"}, {name: "Error Handling"}]
        };

        async function safeFetch(url) {
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('API Rate Limit');
                const json = await res.json();
                return json.data;
            } catch (e) {
                console.warn("Using Fallback Data due to API Error");
                return fallbackData; // Returns dummy data so the site never breaks
            }
        }

        // --- 2. NAVIGATION ---
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
        function switchView(id) {
            ['home', 'browse', 'gacha', 'pvp'].forEach(v => document.getElementById('view-'+v).classList.add('hidden'));
            document.getElementById('view-'+id).classList.remove('hidden');
            if(window.innerWidth < 768) document.getElementById('sidebar').classList.add('-translate-x-full');
        }

        // --- 3. THE HTML CARD GENERATOR ---
        function createCard(data, containerId) {
            const theme = colors[Math.floor(Math.random() * colors.length)];
            const title = data.title || data.name || "Unknown";
            const sub = data.title_japanese || data.name_kanji || "Database Entry";
            const img = data.images?.jpg?.large_image_url || data.images?.jpg?.image_url || fallbackData.images.jpg.large_image_url;
            const score = data.score || (data.favorites ? (data.favorites/1000).toFixed(1)+"k" : "N/A");
            const d1 = data.episodes || data.mal_id || "?";
            const d2 = data.year || "Entity";
            const d3 = data.source || "System";
            let desc = data.synopsis || data.about || "No data.";
            desc = desc.replace(/\\n/g, ' ').substring(0, 200) + "...";
            
            let tags = '';
            (data.genres || fallbackData.genres).slice(0,3).forEach(g => tags += `<span class="tag-pill" style="--card-color:${theme}">${g.name}</span>`);

            const dlTarget = containerId === 'gacha-card' ? 'id="capture-target"' : '';

            document.getElementById(containerId).innerHTML = `
            <div class="ada-card" ${dlTarget} style="--card-color:${theme}">
                <div class="ada-inner">
                    <div class="flex justify-between p-2 bg-[#140a14] border-b border-[#2a152a] text-sm font-bold text-gray-300">
                        <span><i class="fas fa-layer-group mr-1"></i> Data</span>
                        <span class="text-yellow-500"><i class="fas fa-star text-xs"></i> ${score}</span>
                    </div>
                    <div class="card-img-box">
                        <img src="${img}" crossorigin="anonymous">
                        <div class="absolute bottom-2 left-2 bg-black/80 px-2 py-1 text-[10px] rounded font-bold"><i class="fas fa-tv mr-1"></i> JIKAN API</div>
                    </div>
                    <div class="p-4">
                        <h1 class="text-xl font-bold text-white truncate">${title}</h1>
                        <p class="text-[10px] text-gray-500 mb-2">${sub}</p>
                        <div class="flex gap-2 mb-3">${tags}</div>
                        <div class="grid grid-cols-3 gap-2 text-center">
                            <div class="bg-[#110811] p-2 border border-[#2a152a] rounded"><p class="text-[9px] text-gray-500">ID/EP</p><p class="text-xs font-bold">${d1}</p></div>
                            <div class="bg-[#110811] p-2 border border-[#2a152a] rounded"><p class="text-[9px] text-gray-500">YEAR</p><p class="text-xs font-bold">${d2}</p></div>
                            <div class="bg-[#110811] p-2 border border-[#2a152a] rounded"><p class="text-[9px] text-gray-500">SRC</p><p class="text-xs font-bold truncate">${d3}</p></div>
                        </div>
                        <div class="bg-[#110811] p-3 mt-3 border border-[#2a152a] rounded h-24 overflow-y-auto text-xs text-gray-400">${desc}</div>
                    </div>
                </div>
            </div>`;
        }

        // --- 4. FEATURE LOGIC ---
        
        // Home
        async function buildRandomCard(cid) {
            document.getElementById(cid).innerHTML = '<div class="text-center text-gray-500 mt-10"><i class="fas fa-spinner fa-spin text-2xl"></i></div>';
            const data = await safeFetch('https://api.jikan.moe/v4/random/anime');
            createCard(data, cid);
        }

        // Browse
        async function runSearch() {
            const q = document.getElementById('b-query').value;
            const t = document.getElementById('b-type').value;
            if(!q) return;
            const resArea = document.getElementById('b-results');
            resArea.classList.remove('hidden'); document.getElementById('b-card-view').classList.add('hidden');
            resArea.innerHTML = '<div class="col-span-full text-center text-gray-500"><i class="fas fa-spinner fa-spin"></i> Searching...</div>';
            
            try {
                const res = await fetch(`https://api.jikan.moe/v4/${t}?q=${q}&limit=6`);
                const json = await res.json();
                resArea.innerHTML = '';
                if(json.data.length === 0) { resArea.innerHTML = '<div class="text-red-500 col-span-full text-center">No results.</div>'; return; }
                
                json.data.forEach(item => {
                    const title = item.title || item.name;
                    const img = item.images.jpg.image_url;
                    // Escape single quotes in JSON stringification to prevent HTML breaking
                    const safeItem = JSON.stringify(item).replace(/'/g, "&#39;");
                    resArea.innerHTML += `
                        <div onclick='showBcard(${safeItem})' class="bg-[#110811] border border-[#2a152a] rounded overflow-hidden cursor-pointer">
                            <img src="${img}" class="w-full h-32 object-cover"><p class="text-[10px] p-2 truncate text-center font-bold">${title}</p>
                        </div>`;
                });
            } catch(e) { resArea.innerHTML = '<div class="text-red-500 col-span-full text-center">API Error.</div>'; }
        }
        function showBcard(data) {
            document.getElementById('b-results').classList.add('hidden');
            document.getElementById('b-card-view').classList.remove('hidden');
            createCard(data, 'b-single-card');
        }

        // 1-Time Gacha & Download
        async function runGacha() {
            if(gachaPulled) { alert("Roll already claimed!"); return; }
            const btn = document.getElementById('g-pull-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> PULLING...';
            btn.disabled = true;

            const data = await safeFetch('https://api.jikan.moe/v4/random/characters');
            document.getElementById('gacha-card').classList.remove('hidden');
            createCard(data, 'gacha-card');
            
            gachaPulled = true;
            btn.innerHTML = '<i class="fas fa-lock mr-2"></i> CLAIMED';
            btn.classList.replace('bg-red-700', 'bg-gray-800');
            document.getElementById('g-dl-btn').classList.remove('hidden');
        }

        function downloadCard() {
            const target = document.getElementById('capture-target');
            const btn = document.getElementById('g-dl-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> PREPARING...';
            
            html2canvas(target, { useCORS: true, backgroundColor: "#050205" }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Ada_Card.png';
                link.href = canvas.toDataURL();
                link.click();
                btn.innerHTML = '<i class="fas fa-check mr-2"></i> SAVED';
            }).catch(e => {
                alert("Browser strictly blocked external image download. View via Localhost/Termux to fix.");
                btn.innerHTML = '<i class="fas fa-download mr-2"></i> DOWNLOAD CARD';
            });
        }

        // PVP Arena
        async function setupPVP() {
            const btn = document.getElementById('p-summon-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Summoning...';
            
            // Sequential fetching to PREVENT API crash
            const d1 = await safeFetch('https://api.jikan.moe/v4/random/characters');
            await new Promise(r => setTimeout(r, 1000)); // Crucial 1-second delay
            const d2 = await safeFetch('https://api.jikan.moe/v4/random/characters');

            fighters = {
                p1: { name: d1.name||d1.title, hp: 1000, max: 1000, atk: 150 },
                p2: { name: d2.name||d2.title, hp: 1000, max: 1000, atk: 150 }
            };

            document.getElementById('p1-img').src = d1.images?.jpg?.image_url || fallbackData.images.jpg.large_image_url;
            document.getElementById('p1-name').innerText = fighters.p1.name;
            document.getElementById('p1-hp').style.width = '100%';

            document.getElementById('p2-img').src = d2.images?.jpg?.image_url || fallbackData.images.jpg.large_image_url;
            document.getElementById('p2-name').innerText = fighters.p2.name;
            document.getElementById('p2-hp').style.width = '100%';

            document.getElementById('p-arena').classList.remove('hidden');
            document.getElementById('p-fight-btn').classList.remove('hidden');
            document.getElementById('p-log').classList.add('hidden');
            
            btn.innerHTML = '<i class="fas fa-users mr-2"></i> Resummon';
        }

        async function runBattle() {
            document.getElementById('p-fight-btn').classList.add('hidden');
            const log = document.getElementById('p-log');
            log.classList.remove('hidden');
            log.innerHTML = '<div class="text-white font-bold mb-2">BATTLE START!</div>';

            while(fighters.p1.hp > 0 && fighters.p2.hp > 0) {
                // P1 Hits P2
                let dmg1 = Math.floor(Math.random() * fighters.p1.atk) + 20;
                fighters.p2.hp = Math.max(0, fighters.p2.hp - dmg1);
                updatePVP('p2', fighters.p2);
                log.innerHTML += `<div><span class="text-blue-400">${fighters.p1.name}</span> hits for ${dmg1}!</div>`;
                log.scrollTop = log.scrollHeight;
                await new Promise(r => setTimeout(r, 600));
                if(fighters.p2.hp === 0) break;

                // P2 Hits P1
                let dmg2 = Math.floor(Math.random() * fighters.p2.atk) + 20;
                fighters.p1.hp = Math.max(0, fighters.p1.hp - dmg2);
                updatePVP('p1', fighters.p1);
                log.innerHTML += `<div><span class="text-yellow-400">${fighters.p2.name}</span> hits for ${dmg2}!</div>`;
                log.scrollTop = lo
