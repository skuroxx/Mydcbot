<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Bot | Pro Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: #f1f5f9; }
        
        /* This ensures images never explode in size again */
        img { max-width: 100%; height: auto; display: block; }
        
        .glass-card { 
            background: rgba(30, 41, 59, 0.8); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .sidebar-active { 
            background: #2563eb; 
            color: white; 
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); 
        }
    </style>
</head>
<body x-data="{ sidebarOpen: false, activeTab: 'home' }">

    <header class="fixed top-0 w-full z-40 glass-card px-4 py-3 flex justify-between items-center lg:hidden">
        <button @click="sidebarOpen = true" class="text-xl p-3 bg-slate-800 rounded-xl hover:bg-slate-700">
            <i class="fas fa-bars"></i>
        </button>
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white text-xs">A</div>
            <span class="font-bold tracking-tight">ADA BOT</span>
        </div>
        <div class="w-10 h-10 rounded-full border-2 border-blue-600 overflow-hidden">
            <img src="https://cdn.discordapp.com/embed/avatars/0.png" alt="User">
        </div>
    </header>

    <div x-cloak x-show="sidebarOpen" @click="sidebarOpen = false" 
         class="fixed inset-0 bg-black/70 z-50 lg:hidden transition-opacity"></div>

    <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'" 
           class="fixed left-0 top-0 h-screen w-72 glass-card z-50 transition-transform duration-300 ease-in-out border-r border-slate-800 flex flex-col">
        
        <div class="p-6 flex items-center space-x-3 border-b border-slate-800">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center font-bold text-white shadow-lg">A</div>
            <span class="font-extrabold tracking-tighter text-2xl">ADA BOT</span>
        </div>

        <nav class="flex-1 p-4 space-y-2 mt-4">
            <template x-for="item in [
                { id: 'home', icon: 'fa-home', label: 'Home' },
                { id: 'cmds', icon: 'fa-terminal', label: 'Commands' },
                { id: 'dash', icon: 'fa-columns', label: 'Dashboard' }
            ]">
                <button @click="activeTab = item.id; sidebarOpen = false" 
                        :class="activeTab === item.id ? 'sidebar-active' : 'hover:bg-slate-800 text-slate-400'"
                        class="w-full flex items-center space-x-4 p-4 rounded-xl font-bold transition-all">
                    <i class="fas w-5" :class="item.icon"></i>
                    <span x-text="item.label"></span>
                </button>
            </template>
        </nav>

        <div class="p-6 border-t border-slate-800">
            <button class="w-full bg-slate-800 hover:bg-red-900/40 hover:text-red-400 p-4 rounded-xl flex items-center justify-center space-x-2 transition font-bold text-sm">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </button>
        </div>
    </aside>

    <main class="lg:ml-72 pt-24 lg:pt-12 p-6 lg:p-12">
        
        <div x-show="activeTab === 'home'" class="max-w-4xl space-y-8">
            <div class="glass-card p-8 lg:p-12 rounded-[2rem] flex flex-col md:flex-row items-center gap-10">
                <div class="w-32 h-32 md:w-44 md:h-44 rounded-[2rem] overflow-hidden shadow-2xl border-4 border-slate-700">
                    <img src="https://cdn.discordapp.com/embed/avatars/0.png" class="w-full h-full object-cover">
                </div>
                <div class="flex-1 text-center md:text-left">
                    <h1 class="text-4xl lg:text-6xl font-black mb-4 tracking-tight">Ada Bot</h1>
                    <p class="text-slate-400 text-lg leading-relaxed mb-8">The most advanced multipurpose Discord bot. Simplify your server management with one powerful tool.</p>
                    <button class="bg-blue-600 hover:bg-blue-500 px-10 py-4 rounded-2xl font-bold transition-transform hover:scale-105 active:scale-95 shadow-xl shadow-blue-900/20">
                        Add to Discord <i class="fas fa-plus ml-2"></i>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass-card p-8 rounded-[2rem] border-b-4 border-blue-600">
                    <i class="fas fa-shield-alt text-3xl text-blue-500 mb-4"></i>
                    <h3 class="text-xl font-bold mb-2">Moderation</h3>
                    <p class="text-slate-500 text-sm">Warn, Kick, Ban, and Mute tools to keep your server civil and safe.</p>
                </div>
                <div class="glass-card p-8 rounded-[2rem] border-b-4 border-blue-600">
                    <i class="fas fa-music text-3xl text-blue-500 mb-4"></i>
                    <h3 class="text-xl font-bold mb-2">Visual Music</h3>
                    <p class="text-slate-500 text-sm">High-quality audio streaming with Pillow-rendered card previews.</p>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
