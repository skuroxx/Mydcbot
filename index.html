<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PokéQuest Mobile</title>
    <style>
        :root {
            --bg-dark: #0f1215;
            --surface: #1e2126;
            --accent: #ffcb05;
            --common: #919aa2;
            --rare: #4b69ff;
            --epic: #8847ff;
            --legendary: #ffa900;
        }

        /* --- Global & Mobile Layout --- */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: white;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .view { width: 100%; max-width: 500px; padding: 20px; box-sizing: border-box; display: none; }
        .view.active { display: block; }

        /* --- UI Navigation --- */
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 500px;
            background: rgba(30, 33, 38, 0.95);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #333;
            z-index: 1000;
        }

        nav button {
            background: none; border: none; color: #888; font-weight: bold; font-size: 0.9rem;
        }

        nav button.active { color: var(--accent); }

        /* --- The 3D Card Engine --- */
        .card-wrapper {
            perspective: 1200px;
            margin: 40px auto;
            width: 280px;
            height: 400px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* Card Face Styling */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
            border: 4px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .type-badge {
            align-self: flex-start;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
        }

        .poke-art {
            width: 100%;
            height: 200px;
            object-fit: contain;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
        }

        .rarity-star { position: absolute; top: 15px; right: 20px; font-size: 1.2rem; }

        /* --- Specific Type Gradients --- */
        .type-fire { background: linear-gradient(135deg, #ee8130, #ff416c); }
        .type-water { background: linear-gradient(135deg, #6390f0, #0052d4); }
        .type-grass { background: linear-gradient(135deg, #7ac74c, #11998e); }
        .type-electric { background: linear-gradient(135deg, #f7d02c, #f9d423); }
        .type-normal { background: linear-gradient(135deg, #a8a77a, #738276); }

        /* --- Pokedex Grid --- */
        .pokedex-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding-bottom: 80px;
        }

        .pokedex-item {
            background: var(--surface);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            border: 1px solid #333;
        }

        .pokedex-item img { width: 80px; }

        /* --- Progress Bar --- */
        .xp-container {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
        }
        #xp-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

        .btn-action {
            background: #3498db;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
            box-shadow: 0 4px 0 #2980b9;
        }

        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px 0 #2980b9; }

    </style>
</head>
<body>

    <nav>
        <button id="nav-home" class="active" onclick="showView('home')">HOME</button>
        <button id="nav-dex" onclick="showView('pokedex')">DEX</button>
        <button id="nav-shop" onclick="showView('shop')">SHOP</button>
    </nav>

    <div id="home" class="view active">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 id="partner-name">Buddy</h2>
            <div id="wallet">💰 $500</div>
        </div>

        <div class="card-wrapper" onmousemove="tiltCard(event)" onmouseleave="resetCard()">
            <div class="card" id="active-card">
                <div class="card-face" id="card-bg">
                    <div class="type-badge" id="card-type">...</div>
                    <div class="rarity-star" id="card-rarity">⭐</div>
                    <img src="" id="card-img" class="poke-art">
                    <div>
                        <h3 id="card-name" style="margin:0">---</h3>
                        <small>LEVEL <span id="card-lvl">1</span></small>
                        <div class="xp-container"><div id="xp-bar"></div></div>
                    </div>
                </div>
            </div>
        </div>

        <button class="btn-action" onclick="trainBuddy()">Train Buddy (+25 XP)</button>
        <button class="btn-action" style="background:#2ecc71; box-shadow: 0 4px 0 #27ae60;" onclick="work()">Work for Money (+$50)</button>
    </div>

    <div id="pokedex" class="view">
        <h2>Your Collection</h2>
        <div class="pokedex-grid" id="dex-list"></div>
    </div>

    <div id="shop" class="view">
        <h2>Card Shop</h2>
        <div style="background: var(--surface); padding: 30px; border-radius: 20px; text-align: center;">
            <p>Booster Pack: 5 Cards</p>
            <p>Cost: $250</p>
            <button class="btn-action" style="background:var(--accent); color:black;" onclick="buyPack()">Open Pack</button>
        </div>
    </div>

    <script>
        // --- GAME STATE ---
        let state = JSON.parse(localStorage.getItem('pokeSimV2')) || {
            money: 500,
            activeId: 0,
            inventory: []
        };

        const types = ['normal', 'fire', 'water', 'grass', 'electric'];

        // --- CORE FUNCTIONS ---
        async function fetchPokemon(id) {
            const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
            return await res.json();
        }

        async function init() {
            if (state.inventory.length === 0) {
                await addNewPokemon(1); // Start with Bulbasaur
            }
            render();
        }

        async function addNewPokemon(id) {
            const data = await fetchPokemon(id);
            const newPoke = {
                uid: Date.now() + Math.random(),
                id: data.id,
                name: data.name,
                type: data.types[0].type.name,
                sprite: data.sprites.other['official-artwork'].front_default,
                lvl: 1,
                xp: 0,
                rarity: data.base_experience > 200 ? 'Epic' : (data.base_experience > 100 ? 'Rare' : 'Common')
            };
            state.inventory.push(newPoke);
            save();
        }

        function trainBuddy() {
            const buddy = state.inventory[state.activeId];
            buddy.xp += 25;
            if (buddy.xp >= 100) {
                buddy.xp = 0;
                buddy.lvl++;
                checkEvolution(buddy);
            }
            save();
        }

        async function checkEvolution(buddy) {
            const res = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${buddy.id}`);
            const species = await res.json();
            const evoRes = await fetch(species.evolution_chain.url);
            const evoChain = await evoRes.json();

            // Simple Evolution logic: find next in chain
            let nextFormId = null;
            let current = evoChain.chain;
            
            while(current) {
                if(current.species.name === buddy.name && current.evolves_to[0]) {
                    nextFormId = current.evolves_to[0].species.name;
                    break;
                }
                current = current.evolves_to[0];
            }

            if (nextFormId && buddy.lvl >= 5) {
                const newData = await fetchPokemon(nextFormId);
                buddy.id = newData.id;
                buddy.name = newData.name;
                buddy.sprite = newData.sprites.other['official-artwork'].front_default;
                alert(`What? ${buddy.name.toUpperCase()} evolved!`);
                save();
            }
        }

        function work() {
            state.money += 50;
            save();
        }

        async function buyPack() {
            if (state.money < 250) return alert("Not enough money!");
            state.money -= 250;
            const randomId = Math.floor(Math.random() * 150) + 1;
            await addNewPokemon(randomId);
            alert("New Pokemon added to Pokedex!");
            save();
        }

        // --- UI RENDERING ---
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            document.getElementById('nav-' + (viewId === 'home' ? 'home' : (viewId === 'pokedex' ? 'dex' : 'shop'))).classList.add('active');
            if(viewId === 'pokedex') renderDex();
        }

        function render() {
            const buddy = state.inventory[state.activeId];
            document.getElementById('wallet').innerText = `💰 $${state.money}`;
            document.getElementById('card-name').innerText = buddy.name.toUpperCase();
            document.getElementById('card-img').src = buddy.sprite;
            document.getElementById('card-type').innerText = buddy.type;
            document.getElementById('card-lvl').innerText = buddy.lvl;
            document.getElementById('xp-bar').style.width = `${buddy.xp}%`;
            document.getElementById('card-bg').className = `card-face type-${buddy.type}`;
            document.getElementById('card-rarity').innerText = buddy.rarity === 'Epic' ? '⭐⭐⭐' : (buddy.rarity === 'Rare' ? '⭐⭐' : '⭐');
        }

        function renderDex() {
            const list = document.getElementById('dex-list');
            list.innerHTML = state.inventory.map((p, index) => `
                <div class="pokedex-item" onclick="setPartner(${index})">
                    <img src="${p.sprite}">
                    <div style="font-size:0.8rem; font-weight:bold">${p.name.toUpperCase()}</div>
                    <small>Lv. ${p.lvl}</small>
                </div>
            `).join('');
        }

        function setPartner(index) {
            state.activeId = index;
            save();
            showView('home');
        }

        function save() {
            localStorage.setItem('pokeSimV2', JSON.stringify(state));
            render();
        }

        // --- SMOOTH 3D HOVER ---
        function tiltCard(e) {
            const card = document.getElementById('active-card');
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const rotateY = ((x / rect.width) - 0.5) * 30;
            const rotateX = ((y / rect.height) - 0.5) * -30;
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        }

        function resetCard() {
            document.getElementById('active-card').style.transform = `rotateX(0deg) rotateY(0deg)`;
        }

        init();
    </script>
</body>
</html>
