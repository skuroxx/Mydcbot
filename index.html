<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Gacha | Card System</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        :root {
            --theme-primary: #800000; /* Defaults to Maroon */
            --theme-bg: #140a14;
            --theme-border: #2a152a;
        }

        body { 
            background: #050205; 
            color: #e5d7d7; 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden;
        }

        /* The Exact Diagonal Striped Background from your Image */
        .card-striped-bg {
            background: repeating-linear-gradient(
                -45deg,
                var(--theme-bg),
                var(--theme-bg) 10px,
                #0a050a 10px,
                #0a050a 20px
            );
        }

        /* Main Card Container */
        .ada-card {
            border: 2px solid var(--theme-primary);
            border-radius: 12px;
            padding: 10px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
            background: #0a050a;
        }

        .ada-card-inner {
            background: #0d060d;
            border-radius: 8px;
            border: 1px solid var(--theme-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar (Rarity & Rating) */
        .card-header {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: var(--theme-bg);
            border-bottom: 1px solid var(--theme-border);
            font-weight: 900;
            font-size: 0.9rem;
        }

        /* Image Container */
        .card-image-box {
            width: 100%;
            height: 300px;
            border-bottom: 2px solid var(--theme-border);
            position: relative;
            background: #000;
        }

        .card-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .studio-tag {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 2px 6px;
            font-size: 0.65rem;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Tag Pills */
        .genre-tag {
            background: var(--theme-primary);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #fff;
            opacity: 0.8;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .stat-box {
            background: #110811;
            border: 1px solid var(--theme-border);
            border-radius: 6px;
            padding: 6px;
            text-align: center;
        }

        /* Custom Scrollbar for Description */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--theme-primary); border-radius: 4px; }

        /* Slide Menu Transitions */
        .slide-menu { transition: transform 0.3s ease-in-out; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside id="sidebar" class="slide-menu fixed inset-y-0 left-0 w-64 bg-[#0a050a] border-r border-[#2a152a] z-50 transform -translate-x-full md:translate-x-0 md:relative">
        <div class="p-6 flex items-center justify-between border-b border-[#2a152a]">
            <h1 class="text-2xl font-black text-white tracking-widest"><i class="fas fa-dragon text-red-600 mr-2"></i>ADA</h1>
            <button onclick="toggleMenu()" class="md:hidden text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
        </div>
        <nav class="p-4 space-y-2">
            <button onclick="showView('home')" class="w-full text-left p-3 rounded-lg text-gray-300 hover:bg-[#140a14] hover:text-white transition font-bold">
                <i class="fas fa-home w-6"></i> Main Screen
            </button>
            <button onclick="showView('gacha')" class="w-full text-left p-3 rounded-lg text-gray-300 hover:bg-red-900/30 hover:text-white transition font-bold border border-transparent hover:border-red-900/50">
                <i class="fas fa-box-open w-6 text-red-500"></i> 1-Time Gacha
            </button>
            <button onclick="showView('pvp')" class="w-full text-left p-3 rounded-lg text-gray-300 hover:bg-[#140a14] hover:text-white transition font-bold">
                <i class="fas fa-khanda w-6"></i> PVP Arena
            </button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto relative">
        
        <header class="md:hidden flex items-center p-4 bg-[#0a050a] border-b border-[#2a152a]">
            <button onclick="toggleMenu()" class="text-white mr-4"><i class="fas fa-bars text-xl"></i></button>
            <span class="font-black tracking-widest">ADA GACHA</span>
        </header>

        <div id="view-home" class="p-4 md:p-8 flex flex-col items-center w-full min-h-full">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-black mb-1">Random Explorer</h2>
                <p class="text-sm text-gray-500">Discovering random entities from the Jikan API</p>
                <button onclick="loadCard('home-card-container')" class="mt-4 bg-[#140a14] border border-[#2a152a] px-4 py-2 rounded text-sm hover:bg-[#2a152a] transition"><i class="fas fa-sync-alt mr-2"></i>Refresh Random</button>
            </div>
            <div id="home-card-container">
                </div>
        </div>

        <div id="view-gacha" class="p-4 md:p-8 flex flex-col items-center w-full min-h-full hidden">
            <div class="text-center mb-6 max-w-md">
                <h2 class="text-3xl font-black text-red-500 mb-2 drop-shadow-[0_0_10px_rgba(255,0,0,0.5)]">MYSTERY PULL</h2>
                <p class="text-sm text-gray-400 mb-6">You have exactly one chance to pull a card. Once pulled, you can download the image to your device.</p>
                
                <div class="flex flex-col gap-3">
                    <button id="btn-pull" onclick="executeOneTimePull()" class="bg-red-700 hover:bg-red-600 text-white font-black py-4 px-8 rounded-xl tracking-widest shadow-[0_0_20px_rgba(255,0,0,0.3)] transition">
                        <i class="fas fa-dice-d20 mr-2"></i> PULL CARD (1/1)
                    </button>
                    <button id="btn-download" onclick="downloadCard()" class="bg-blue-700 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-xl transition hidden">
                        <i class="fas fa-download mr-2"></i> SAVE IMAGE TO DEVICE
                    </button>
                </div>
            </div>
            
            <div id="gacha-card-container" style="display: none;">
                </div>
        </div>

        <div id="view-pvp" class="p-4 md:p-8 flex flex-col items-center w-full min-h-full hidden">
            <h2 class="text-3xl font-black text-purple-500 mb-2">BATTLE ARENA</h2>
            <p class="text-gray-500 mb-8">PVP Module Offline. Constructing environment...</p>
            <i class="fas fa-tools text-6xl text-gray-700 animate-pulse"></i>
        </div>

    </main>

    <script>
        let hasPulled = false;

        // Theme Palettes to simulate "Anime Themes"
        const themes = [
            { p: '#800000', bg: '#1a0505', b: '#3a0c0c' }, // Maroon
            { p: '#003366', bg: '#050a1a', b: '#0a153a' }, // Deep Blue
            { p: '#4b0082', bg: '#0d051a', b: '#1d0c3a' }, // Indigo
            { p: '#004d00', bg: '#051a05', b: '#0c3a0c' }, // Dark Green
            { p: '#8b6508', bg: '#1a1405', b: '#3a2d0c' }  // Dark Gold
        ];

        // 1. UI Navigation
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            if(sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
            } else {
                sidebar.classList.add('-translate-x-full');
            }
        }

        function showView(viewId) {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-gacha').classList.add('hidden');
            document.getElementById('view-pvp').classList.add('hidden');
            document.getElementById('view-' + viewId).classList.remove('hidden');
            
            // On mobile, close menu after clicking
            if(window.innerWidth < 768) toggleMenu();
        }

        // 2. API Fetching & Card Building
        async function loadCard(containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="text-gray-500 animate-pulse"><i class="fas fa-spinner fa-spin mr-2"></i> Connecting to Jikan API...</div>`;
            
            try {
                // Fetch random Anime
                const res = await fetch('https://api.jikan.moe/v4/random/anime');
                const json = await res.json();
                const data = json.data;

                // Pick a random theme color
                const theme = themes[Math.floor(Math.random() * themes.length)];
                
                // Build the HTML template matching your image
                container.innerHTML = generateCardHTML(data, theme, containerId);
                
                // Apply the CSS variables strictly to this card's wrapper
                const cardElement = container.querySelector('.ada-card');
                cardElement.style.setProperty('--theme-primary', theme.p);
                cardElement.style.setProperty('--theme-bg', theme.bg);
                cardElement.style.setProperty('--theme-border', theme.b);

            } catch (err) {
                container.innerHTML = `<div class="text-red-500"><i class="fas fa-exclamation-triangle"></i> API Rate Limit Reached. Please wait a moment.</div>`;
            }
        }

        function generateCardHTML(data, theme, containerId) {
            // Data fallbacks
            const title = data.title || "Unknown Entity";
            const subTitle = data.title_japanese || "Canonical Data";
            const image = data.images.jpg.large_image_url || data.images.jpg.image_url;
            const score = data.score ? data.score.toFixed(2) : "N/A";
            const eps = data.episodes || "?";
            const year = data.year || "N/A";
            const source = data.source || "Original";
            let desc = data.synopsis || "No description available in the database.";
            if (desc.length > 200) desc = desc.substring(0, 200) + "..."; // truncate like image

            // Genres
            let tagsHtml = '';
            if (data.genres && data.genres.length > 0) {
                data.genres.slice(0, 3).forEach(g => {
                    tagsHtml += `<span class="genre-tag" style="background:${theme.p}">${g.name}</span>`;
                });
            } else {
                tagsHtml = `<span class="genre-tag" style="background:${theme.p}">Unknown</span>`;
            }

            // The ID "capture-target" is only used for the Gacha pull to know what to download
            const captureId = containerId === 'gacha-card-container' ? 'id="capture-target"' : '';

            return `
            <div class="card-striped-bg ada-card" ${captureId}>
                <div class="ada-card-inner">
                    
                    <div class="card-header text-gray-300">
                        <span><i class="fas fa-tablet-alt mr-2"></i> Common</span>
                        <span class="text-yellow-500"><i class="fas fa-star text-xs mr-1"></i> ${score}</span>
                    </div>

                    <div class="card-image-box">
                        <img src="${image}" crossorigin="anonymous" alt="Artwork">
                        <div class="studio-tag"><i class="fas fa-tv text-gray-400 mr-1"></i> JIKAN DATABASE</div>
                    </div>

                    <div class="p-4 bg-[#0d060d]">
                        <h1 class="text-2xl font-bold mb-0 text-white truncate leading-tight">${title}</h1>
                        <p class="text-[10px] text-gray-500 mb-3 font-bold">${subTitle}</p>
                        
                        <div class="flex gap-2 mb-2">
                            ${tagsHtml}
                        </div>

                        <div class="stats-grid">
                            <div class="stat-box">
                                <p class="text-[9px] text-gray-500 uppercase tracking-widest"><i class="fas fa-film"></i> Episodes</p>
                                <p class="font-bold text-sm text-gray-200 mt-1">${eps}</p>
                            </div>
                            <div class="stat-box">
                                <p class="text-[9px] text-gray-500 uppercase tracking-widest"><i class="fas fa-calendar"></i> Year</p>
                                <p class="font-bold text-sm text-gray-200 mt-1">${year}</p>
                            </div>
                            <div class="stat-box">
                                <p class="text-[9px] text-gray-500 uppercase tracking-widest"><i class="fas fa-book"></i> Source</p>
                                <p class="font-bold text-sm text-gray-200 mt-1 truncate">${source}</p>
                            </div>
                        </div>

                        <div class="bg-[#110811] p-3 mt-3 rounded-lg border border-[#2a152a] h-28 overflow-y-auto text-xs text-gray-400 leading-relaxed font-semibold">
                            ${desc}
                        </div>

                        <div class="border border-[#2a152a] bg-[#140a14] rounded-lg p-2 mt-3 text-xs text-gray-500 font-bold">
                             <i class="fas fa-info-circle mr-2"></i> No community ratings yet — be first!
                        </div>
                    </div>

                    <div class="card-striped-bg p-2 px-4 flex justify-between items-center text-[9px] text-gray-600 border-t border-[#2a152a] font-black">
                        <span style="color:${theme.p}">myanimelist.net</span>
                        <span>ADA BOT v3.4.0 <i class="fas fa-diamond ml-1 text-[7px]"></i></span>
                    </div>
                </div>
            </div>
            `;
        }

        // 3. One-Time Gacha Logic
        async function executeOneTimePull() {
            if (hasPulled) {
                alert("You have already used your 1-Time Pull!");
                return;
            }

            const btn = document.getElementById('btn-pull');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> PULLING...';
            btn.disabled = true;

            await loadCard('gacha-card-container');
            
            // Check if card loaded successfully (not rate limited)
            if(document.getElementById('capture-target')) {
                hasPulled = true;
                btn.innerHTML = '<i class="fas fa-lock mr-2"></i> ROLL CLAIMED';
                btn.classList.replace('bg-red-700', 'bg-gray-800');
                btn.classList.replace('hover:bg-red-600', 'hover:bg-gray-800');
                btn.classList.remove('shadow-[0_0_20px_rgba(255,0,0,0.3)]');
                
                document.getElementById('gacha-card-container').style.display = 'block';
                document.getElementById('btn-download').classList.remove('hidden');
            } else {
                // If failed, let them try again
                btn.innerHTML = '<i class="fas fa-dice-d20 mr-2"></i> TRY PULL AGAIN';
                btn.disabled = false;
            }
        }

        // 4. Download Card Logic (HTML2Canvas)
        function downloadCard() {
            const target = document.getElementById('capture-target');
            const btn = document.getElementById('btn-download');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> PROCESSING...';
            btn.disabled = true;

            html2canvas(target, {
                useCORS: true, // Crucial for external images
                backgroundColor: "#050205", // Matches body background to avoid white borders
                scale: 2 // Higher resolution
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Ada_Gacha_Pull.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                btn.innerHTML = '<i class="fas fa-check mr-2"></i> DOWNLOADED';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-download mr-2"></i> SAVE IMAGE TO DEVICE';
                    btn.disabled = false;
                }, 2000);
            }).catch(err => {
                alert("Your browser security settings blocked the image download. This usually happens on strict mobile browsers.");
                btn.innerHTML = '<i class="fas fa-download mr-2"></i> SAVE IMAGE TO DEVICE';
                btn.disabled = false;
            });
        }

        // Initialize Home Screen on Load
        window.onload = () => {
            loadCard('home-card-container');
        };
    </script>
</body>
</html>
